<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CAPP!C Deck Studio</title>
  <link rel="stylesheet" href="styles/tokens.css">
  <style>
    /* ── Reset ── */
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    body { background:#0A0A0A; color:#fff; font-family:var(--font-family); min-height:100vh; overflow:hidden; }

    /* ── Header ── */
    .header {
      display:flex; align-items:center; justify-content:space-between;
      padding:10px 20px; border-bottom:1px solid rgba(255,255,255,0.06);
      background:#0A0A0A; height:48px;
    }
    .header-left { display:flex; align-items:center; gap:12px; }
    .logo { font-size:16px; font-weight:800; letter-spacing:-0.5px; }
    .hdiv { width:1px; height:16px; background:rgba(255,255,255,0.1); }

    /* ── Version Selector ── */
    .version-btn {
      font-size:13px; color:#B0B0B0; cursor:pointer; padding:4px 10px;
      border-radius:6px; border:1px solid rgba(255,255,255,0.08);
      background:transparent; font-family:inherit; font-weight:600;
    }
    .version-btn:hover { border-color:var(--secondary); color:var(--secondary); }

    /* ── Mode Toggles ── */
    .header-right { display:flex; align-items:center; gap:8px; }
    .toggle-group {
      display:flex; gap:1px; background:rgba(255,255,255,0.04);
      border-radius:6px; padding:2px;
    }
    .toggle-btn {
      padding:4px 10px; border-radius:4px; font-size:11px; font-weight:700;
      color:#888; cursor:pointer; border:none; background:transparent;
      font-family:inherit; transition:all 0.15s;
    }
    .toggle-btn:hover { color:#ccc; }
    .toggle-btn.active { background:var(--secondary); color:#000; }
    .toggle-label { font-size:10px; color:#666; font-weight:600; letter-spacing:0.5px; margin-right:4px; }

    /* ── Main Layout ── */
    .main { display:flex; height:calc(100vh - 48px); }

    /* ── Slide List Panel ── */
    .panel-list {
      width:240px; min-width:240px; overflow-y:auto; padding:8px;
      border-right:1px solid rgba(255,255,255,0.06);
    }
    .panel-list::-webkit-scrollbar { width:4px; }
    .panel-list::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.1); border-radius:2px; }

    /* ── Filters ── */
    .filters { display:flex; flex-wrap:wrap; gap:3px; margin-bottom:8px; padding:4px 0; }
    .filter-btn {
      padding:4px 10px; border-radius:12px; border:1px solid rgba(255,255,255,0.06);
      background:transparent; color:#888; font-size:11px; font-weight:600;
      cursor:pointer; font-family:inherit;
    }
    .filter-btn:hover { border-color:rgba(255,255,255,0.15); color:#ccc; }
    .filter-btn.active { background:rgba(255,255,255,0.1); color:#fff; border-color:rgba(255,255,255,0.15); }

    /* ── Slide Card ── */
    .slide-card {
      padding:8px 10px; border-radius:6px; cursor:pointer;
      border:1px solid transparent; margin-bottom:2px;
      transition:all 0.1s; display:flex; align-items:center; gap:8px;
    }
    .slide-card:hover { background:rgba(255,255,255,0.03); }
    .slide-card.active { border-color:var(--secondary); background:rgba(126,220,230,0.04); }
    .card-num { font-size:12px; font-weight:800; color:#444; min-width:20px; font-variant-numeric:tabular-nums; }
    .slide-card.active .card-num { color:var(--secondary); }
    .card-info { flex:1; min-width:0; }
    .card-title { font-size:13px; font-weight:700; color:#E0E0E0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .card-tags { display:flex; gap:3px; flex-shrink:0; }
    .card-tag {
      font-size:9px; font-weight:700; padding:1px 5px; border-radius:3px;
      background:rgba(255,255,255,0.06); flex-shrink:0;
    }

    /* ── Preview Panel ── */
    .panel-preview {
      flex:1; display:flex; flex-direction:column; padding:12px 16px;
      overflow:hidden;
    }
    .preview-frame {
      flex:1; border-radius:4px; overflow:hidden;
      box-shadow:0 4px 20px rgba(0,0,0,0.4);
      border:1px solid rgba(255,255,255,0.1);
      position:relative; background:#2a2a2a;
    }
    .preview-frame iframe {
      position:absolute; top:0; left:0;
      transform-origin:top left; border:none;
    }

    /* ── Controls Bar ── */
    .controls {
      display:flex; align-items:center; justify-content:space-between;
      padding:8px 0; flex-shrink:0;
    }
    .controls-nav { display:flex; align-items:center; gap:8px; }
    .nav-btn {
      padding:4px 12px; border-radius:6px; border:1px solid rgba(255,255,255,0.08);
      background:transparent; color:#B0B0B0; font-size:12px; font-weight:600;
      cursor:pointer; font-family:inherit;
    }
    .nav-btn:hover { border-color:var(--secondary); color:var(--secondary); }
    .nav-btn:disabled { opacity:0.3; cursor:default; }
    .nav-counter { font-size:13px; font-weight:700; color:#888; min-width:50px; text-align:center; }

    .controls-actions { display:flex; align-items:center; gap:6px; }
    .btn {
      padding:5px 12px; border-radius:6px; border:1px solid rgba(255,255,255,0.08);
      background:rgba(255,255,255,0.04); color:#E0E0E0; font-size:11px; font-weight:700;
      cursor:pointer; font-family:inherit;
    }
    .btn:hover { background:rgba(255,255,255,0.08); border-color:rgba(255,255,255,0.15); }
    .btn-primary { background:var(--secondary); color:#000; border-color:var(--secondary); }
    .btn-primary:hover { background:var(--secondary-dark); }

    /* ── Status Bar ── */
    .status-bar {
      display:flex; align-items:center; justify-content:space-between;
      padding:6px 0; border-top:1px solid rgba(255,255,255,0.04);
      font-size:10px; color:#555; flex-shrink:0;
    }
    .status-dot { width:6px; height:6px; border-radius:50%; background:#444; margin-right:6px; display:inline-block; }
    .status-dot.saved { background:var(--semantic-up); }
    .status-dot.saving { background:var(--accent); }

    /* ── Modal ── */
    .modal-overlay {
      position:fixed; inset:0; background:rgba(0,0,0,0.7); backdrop-filter:blur(8px);
      display:none; align-items:center; justify-content:center; z-index:200;
    }
    .modal-overlay.open { display:flex; }
    .modal {
      background:#1a1a1a; border:1px solid rgba(255,255,255,0.1);
      border-radius:12px; padding:20px; width:420px; max-height:70vh; overflow-y:auto;
    }
    .modal h2 { font-size:15px; font-weight:700; margin-bottom:12px; }
    .modal-input {
      width:100%; padding:8px 12px; border-radius:6px;
      border:1px solid rgba(255,255,255,0.1); background:rgba(255,255,255,0.06);
      color:#fff; font-size:13px; font-family:inherit; margin-bottom:10px; box-sizing:border-box;
    }
    .modal-input:focus { outline:none; border-color:var(--secondary); }
    .version-list { list-style:none; margin-bottom:10px; }
    .version-item {
      display:flex; align-items:center; justify-content:space-between;
      padding:8px 10px; border-radius:6px; border:1px solid rgba(255,255,255,0.04);
      margin-bottom:4px; cursor:pointer;
    }
    .version-item:hover { background:rgba(255,255,255,0.04); }
    .version-item.current { border-color:var(--secondary); }
    .version-item-name { font-weight:600; font-size:13px; }
    .version-item-meta { font-size:10px; color:#666; }
    .version-item-actions { display:flex; gap:4px; }
    .version-item-btn {
      padding:3px 8px; border-radius:4px; border:1px solid rgba(255,255,255,0.06);
      background:transparent; color:#888; font-size:10px; font-weight:600;
      cursor:pointer; font-family:inherit;
    }
    .version-item-btn:hover { color:#fff; border-color:rgba(255,255,255,0.2); }
    .version-item-btn.delete:hover { color:#FF4D6A; border-color:rgba(255,77,106,0.3); }
    .modal-actions { display:flex; gap:6px; justify-content:flex-end; margin-top:10px; }

    /* ── Toast ── */
    .toast {
      position:fixed; bottom:20px; left:50%; transform:translateX(-50%) translateY(80px);
      background:var(--secondary); color:#000; padding:8px 18px; border-radius:8px;
      font-weight:700; font-size:12px; transition:transform 0.3s; z-index:300;
    }
    .toast.show { transform:translateX(-50%) translateY(0); }

    /* ── Lock Screen ── */
    .lock-overlay {
      position:fixed; inset:0; background:#0A0A0A; z-index:9999;
      display:flex; align-items:center; justify-content:center; flex-direction:column; gap:24px;
    }
    .lock-overlay.hidden { display:none; }
    .lock-title { font-size:24px; font-weight:800; letter-spacing:-0.5px; color:#fff; }
    .lock-sub { font-size:13px; color:#666; font-weight:600; }
    .lock-input {
      width:200px; padding:10px 16px; border-radius:8px; border:1px solid rgba(255,255,255,0.1);
      background:rgba(255,255,255,0.06); color:#fff; font-size:16px; font-family:inherit;
      text-align:center; letter-spacing:8px; font-weight:700;
    }
    .lock-input:focus { outline:none; border-color:var(--secondary); }
    .lock-input.error { border-color:#FF4D6A; animation:shake 0.3s; }
    @keyframes shake {
      0%,100% { transform:translateX(0); }
      25% { transform:translateX(-6px); }
      75% { transform:translateX(6px); }
    }
    .lock-error { font-size:12px; color:#FF4D6A; font-weight:600; height:16px; }

    /* ── Loading Spinner ── */
    .lock-spinner {
      display:none; width:32px; height:32px;
      border:3px solid rgba(255,255,255,0.1);
      border-top-color:var(--secondary);
      border-radius:50%;
      animation:spin 0.8s linear infinite;
    }
    .lock-overlay.loading .lock-input,
    .lock-overlay.loading .lock-error,
    .lock-overlay.loading .lock-sub { display:none; }
    .lock-overlay.loading .lock-spinner { display:block; }
    @keyframes spin { to { transform:rotate(360deg); } }
  </style>
</head>
<body>

  <!-- ══ Lock Screen ══ -->
  <div class="lock-overlay" id="lockScreen">
    <div class="lock-title">CAPP!C Deck Studio</div>
    <div class="lock-sub">비밀번호를 입력하세요</div>
    <input class="lock-input" id="lockInput" type="password" maxlength="4" placeholder="····" autofocus>
    <div class="lock-error" id="lockError"></div>
    <div class="lock-spinner"></div>
  </div>

  <!-- ══ Header ══ -->
  <div class="header">
    <div class="header-left">
      <div class="logo">CAPP!C Deck Studio</div>
      <div class="hdiv"></div>
      <button class="version-btn" id="versionBtn" onclick="openVersionModal()">v—</button>
    </div>
    <div class="header-right">
      <span class="toggle-label">비율</span>
      <div class="toggle-group" id="ratioToggle">
        <button class="toggle-btn active" data-ratio="16:9">16:9</button>
        <button class="toggle-btn" data-ratio="3:2">3:2</button>
      </div>
      <div class="hdiv"></div>
      <span class="toggle-label">테마</span>
      <div class="toggle-group" id="themeToggle">
        <button class="toggle-btn active" data-theme="dark">Dark</button>
        <button class="toggle-btn" data-theme="light">Light</button>
      </div>
    </div>
  </div>

  <!-- ══ Main ══ -->
  <div class="main">
    <!-- Slide List -->
    <div class="panel-list" id="panelList">
      <div class="filters" id="filters"></div>
      <div id="slideList"></div>
    </div>

    <!-- Preview -->
    <div class="panel-preview">
      <div class="preview-frame" id="previewFrame">
        <iframe id="previewIframe"></iframe>
      </div>
      <div class="controls">
        <div class="controls-nav">
          <button class="nav-btn" id="prevBtn" onclick="navPrev()">◀</button>
          <span class="nav-counter" id="navCounter">—</span>
          <button class="nav-btn" id="nextBtn" onclick="navNext()">▶</button>
        </div>
        <div class="controls-actions">
          <button class="btn" onclick="exportPNG()">PNG</button>
          <button class="btn btn-primary" onclick="exportAll()">전체 내보내기</button>
        </div>
      </div>
      <div class="status-bar">
        <div><span class="status-dot" id="statusDot"></span><span id="statusText">준비됨</span></div>
        <div id="statusVersion">—</div>
      </div>
    </div>
  </div>

  <!-- ══ Version Modal ══ -->
  <div class="modal-overlay" id="versionModal">
    <div class="modal">
      <h2>버전 관리</h2>
      <ul class="version-list" id="versionList"></ul>
      <div style="border-top:1px solid rgba(255,255,255,0.06); padding-top:10px; margin-top:6px;">
        <div style="font-size:11px; color:#888; margin-bottom:6px; font-weight:600;">새 버전 저장</div>
        <input class="modal-input" id="newVersionName" placeholder="YYMMDD_이름 (예: 260517_시리즈A)">
        <div class="modal-actions">
          <button class="btn" onclick="closeVersionModal()">닫기</button>
          <button class="btn btn-primary" onclick="saveVersion()">저장</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ══ Toast ══ -->
  <div class="toast" id="toast"></div>

  <script>
    // ══════════════════════════════════════
    //  STATE
    // ══════════════════════════════════════
    let slidesData = null;
    let currentSlideIndex = 0;
    let currentRatio = '16:9';
    let currentTheme = 'dark';
    let currentFilter = 'all';
    let currentVersionId = null;
    let versions = [];
    let autosaveTimer = null;
    let lastAutosaveTime = null;
    let filteredSlides = [];

    const API = 'http://localhost:3001';

    // ── HTML escape helper ──
    function esc(str) {
      const d = document.createElement('div');
      d.textContent = str;
      return d.innerHTML;
    }

    // ══════════════════════════════════════
    //  INIT
    // ══════════════════════════════════════
    async function init() {
      // Load slides registry
      const res = await fetch('data/slides.json');
      slidesData = await res.json();

      // Load versions & restore state
      await loadVersions();

      // Build filters
      renderFilters();

      // Render slide list
      applyFilter();

      // Setup mode toggles
      setupToggles();

      // Start autosave
      startAutosave();

      // Keyboard navigation
      document.addEventListener('keydown', onKeydown);

      // Window resize → rescale preview
      window.addEventListener('resize', rescalePreview);

      // Wait for first slide preview to load
      await new Promise(resolve => {
        const iframe = document.getElementById('previewIframe');
        if (!iframe.src || iframe.src === 'about:blank') return resolve();
        const onLoad = () => { iframe.removeEventListener('load', onLoad); resolve(); };
        iframe.addEventListener('load', onLoad);
        // Timeout fallback
        setTimeout(resolve, 3000);
      });
    }

    // ══════════════════════════════════════
    //  VERSIONS
    // ══════════════════════════════════════
    async function loadVersions() {
      try {
        const res = await fetch(`${API}/versions`);
        if (res.ok) {
          const data = await res.json();
          versions = data.versions || [];
          currentVersionId = data.current;

          // Apply current version config
          if (currentVersionId) {
            const v = versions.find(v => v.id === currentVersionId);
            if (v && v.config) {
              currentTheme = v.config.theme || 'dark';
              currentRatio = v.config.ratio || '16:9';
            }
          }

          updateVersionUI();
        }
      } catch(e) {
        console.warn('Version server not available, using defaults');
      }

      // Try autosave recovery
      try {
        const res = await fetch(`${API}/autosave`);
        if (res.ok) {
          const auto = await res.json();
          if (auto && auto.savedAt) {
            lastAutosaveTime = new Date(auto.savedAt);
          }
        }
      } catch(e) {}
    }

    async function saveVersion() {
      const nameInput = document.getElementById('newVersionName');
      let name = nameInput.value.trim();
      if (!name) {
        // Auto-generate: YYMMDD_버전
        const now = new Date();
        const yy = String(now.getFullYear()).slice(2);
        const mm = String(now.getMonth()+1).padStart(2,'0');
        const dd = String(now.getDate()).padStart(2,'0');
        name = `${yy}${mm}${dd}_v${versions.length+1}`;
      }

      const config = buildConfig();

      try {
        const res = await fetch(`${API}/save-version`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id: name, config })
        });
        if (res.ok) {
          const result = await res.json();
          await loadVersions();
          currentVersionId = name;
          updateVersionUI();
          nameInput.value = '';
          closeVersionModal();
          showToast(`버전 "${name}" 저장됨`);
        }
      } catch(e) {
        showToast('저장 실패 — 서버 확인');
      }
    }

    async function loadVersion(id) {
      const v = versions.find(v => v.id === id);
      if (!v) return;

      currentVersionId = id;
      if (v.config) {
        currentTheme = v.config.theme || 'dark';
        currentRatio = v.config.ratio || '16:9';
        updateToggleUI();
      }

      updateVersionUI();
      updatePreview();
      closeVersionModal();
      showToast(`"${id}" 로드됨`);

      // Update server
      try {
        await fetch(`${API}/save-version`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id, config: v.config })
        });
      } catch(e) {}
    }

    async function deleteVersion(id) {
      if (!confirm(`"${id}" 버전을 삭제할까요?`)) return;
      try {
        await fetch(`${API}/delete-version?id=${encodeURIComponent(id)}`, { method: 'DELETE' });
        await loadVersions();
        renderVersionList();
        showToast(`"${id}" 삭제됨`);
      } catch(e) {
        showToast('삭제 실패');
      }
    }

    function buildConfig() {
      return {
        selected: slidesData.slides.map(s => s.id),
        theme: currentTheme,
        ratio: currentRatio,
        tokenOverrides: {},
        slideStyles: {}
      };
    }

    function updateVersionUI() {
      document.getElementById('versionBtn').textContent = currentVersionId ? `v:${currentVersionId}` : 'v—';
      document.getElementById('statusVersion').textContent = currentVersionId || '—';
    }

    // ══════════════════════════════════════
    //  AUTOSAVE
    // ══════════════════════════════════════
    function startAutosave() {
      autosaveTimer = setInterval(doAutosave, 30000);
    }

    async function doAutosave() {
      const config = buildConfig();
      try {
        const res = await fetch(`${API}/autosave`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ config })
        });
        if (res.ok) {
          lastAutosaveTime = new Date();
          updateStatusBar('saved');
        }
      } catch(e) {
        updateStatusBar('error');
      }
    }

    function updateStatusBar(state) {
      const dot = document.getElementById('statusDot');
      const text = document.getElementById('statusText');
      if (state === 'saved') {
        dot.className = 'status-dot saved';
        text.textContent = `자동저장됨 ${formatTime(lastAutosaveTime)}`;
      } else if (state === 'saving') {
        dot.className = 'status-dot saving';
        text.textContent = '저장 중...';
      } else {
        dot.className = 'status-dot';
        text.textContent = '서버 미연결';
      }
    }

    function formatTime(date) {
      if (!date) return '';
      const h = String(date.getHours()).padStart(2,'0');
      const m = String(date.getMinutes()).padStart(2,'0');
      const s = String(date.getSeconds()).padStart(2,'0');
      return `${h}:${m}:${s}`;
    }

    // ══════════════════════════════════════
    //  FILTERS & SLIDE LIST
    // ══════════════════════════════════════
    function renderFilters() {
      const tags = slidesData.tags;
      let html = `<button class="filter-btn active" onclick="setFilter('all',this)">전체</button>`;
      Object.entries(tags).forEach(([key, tag]) => {
        html += `<button class="filter-btn" onclick="setFilter('${key}',this)">${tag.label}</button>`;
      });
      document.getElementById('filters').innerHTML = html;
    }

    function setFilter(f, el) {
      currentFilter = f;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      if (el) el.classList.add('active');
      applyFilter();
    }

    function applyFilter() {
      if (currentFilter === 'all') {
        filteredSlides = [...slidesData.slides];
      } else {
        filteredSlides = slidesData.slides.filter(s => s.tags && s.tags.includes(currentFilter));
      }
      renderSlideList();
      if (filteredSlides.length > 0) {
        currentSlideIndex = 0;
        selectSlide(0);
      }
    }

    function renderSlideList() {
      const tags = slidesData.tags;
      let html = '';
      filteredSlides.forEach((s, i) => {
        const isActive = i === currentSlideIndex;
        const allIdx = slidesData.slides.indexOf(s) + 1;
        const tagHtml = (s.tags || []).map(t => {
          const tag = tags[t];
          if (!tag) return '';
          return `<span class="card-tag" style="color:${esc(tag.color)};border:1px solid ${esc(tag.color)}33">${esc(tag.label)}</span>`;
        }).join('');
        html += `
          <div class="slide-card ${isActive ? 'active' : ''}" data-index="${i}" onclick="selectSlide(${i})">
            <span class="card-num">${String(allIdx).padStart(2,'0')}</span>
            <div class="card-info">
              <div class="card-title">${esc(s.title)}</div>
            </div>
            <div class="card-tags">${tagHtml}</div>
          </div>`;
      });
      document.getElementById('slideList').innerHTML = html;
    }

    // ══════════════════════════════════════
    //  PREVIEW
    // ══════════════════════════════════════
    function selectSlide(index) {
      currentSlideIndex = index;
      // Highlight in list
      document.querySelectorAll('.slide-card').forEach((c, i) => {
        c.classList.toggle('active', i === index);
      });
      updatePreview();
      updateNavCounter();

      // Scroll into view
      const card = document.querySelector(`.slide-card[data-index="${index}"]`);
      if (card) card.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }

    function updatePreview() {
      if (!filteredSlides.length) return;
      const slide = filteredSlides[currentSlideIndex];
      if (!slide) return;

      const iframe = document.getElementById('previewIframe');
      const url = `preview.html?slide=${slide.id}&theme=${currentTheme}&ratio=${encodeURIComponent(currentRatio)}`;
      iframe.src = url;

      // Wait for iframe load then rescale
      iframe.onload = () => rescalePreview();
    }

    function rescalePreview() {
      const frame = document.getElementById('previewFrame');
      const iframe = document.getElementById('previewIframe');
      if (!frame || !iframe) return;

      const RATIOS = {
        '16:9': { w: 1920, h: 1080 },
        '3:2':  { w: 1620, h: 1080 },
      };
      const dim = RATIOS[currentRatio] || RATIOS['16:9'];

      iframe.style.width = dim.w + 'px';
      iframe.style.height = dim.h + 'px';

      const containerW = frame.clientWidth;
      const containerH = frame.clientHeight;
      const scaleW = containerW / dim.w;
      const scaleH = containerH / dim.h;
      const scale = Math.min(scaleW, scaleH);

      iframe.style.transform = `scale(${scale})`;

      // Center the iframe
      const scaledW = dim.w * scale;
      const scaledH = dim.h * scale;
      iframe.style.left = ((containerW - scaledW) / 2) + 'px';
      iframe.style.top = ((containerH - scaledH) / 2) + 'px';
    }

    function updateNavCounter() {
      const total = filteredSlides.length;
      const current = currentSlideIndex + 1;
      document.getElementById('navCounter').textContent = `${current} / ${total}`;
      document.getElementById('prevBtn').disabled = currentSlideIndex === 0;
      document.getElementById('nextBtn').disabled = currentSlideIndex >= total - 1;
    }

    // ══════════════════════════════════════
    //  NAVIGATION
    // ══════════════════════════════════════
    function navPrev() {
      if (currentSlideIndex > 0) selectSlide(currentSlideIndex - 1);
    }

    function navNext() {
      if (currentSlideIndex < filteredSlides.length - 1) selectSlide(currentSlideIndex + 1);
    }

    function onKeydown(e) {
      // Don't capture when typing in input
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); navPrev(); }
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); navNext(); }
      if (e.key === 'Escape') closeVersionModal();
    }

    // ══════════════════════════════════════
    //  MODE TOGGLES
    // ══════════════════════════════════════
    function setupToggles() {
      // Ratio
      document.querySelectorAll('#ratioToggle .toggle-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          currentRatio = btn.dataset.ratio;
          updateToggleUI();
          updatePreview();
        });
      });

      // Theme
      document.querySelectorAll('#themeToggle .toggle-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          currentTheme = btn.dataset.theme;
          updateToggleUI();
          updatePreview();
        });
      });

      updateToggleUI();
    }

    function updateToggleUI() {
      document.querySelectorAll('#ratioToggle .toggle-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.ratio === currentRatio);
      });
      document.querySelectorAll('#themeToggle .toggle-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.theme === currentTheme);
      });
    }

    // ══════════════════════════════════════
    //  EXPORT
    // ══════════════════════════════════════
    async function exportPNG() {
      if (!filteredSlides.length) return;
      const slide = filteredSlides[currentSlideIndex];
      showToast('PNG 추출 중...');
      try {
        const res = await fetch(`${API}/capture?slide=${slide.id}&theme=${currentTheme}&ratio=${encodeURIComponent(currentRatio)}`);
        if (!res.ok) throw new Error(await res.text());
        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = `${slide.id}_${currentRatio.replace(':','x')}_${currentTheme}.png`;
        link.click();
        URL.revokeObjectURL(url);
        showToast('PNG 추출 완료');
      } catch(e) {
        showToast('추출 실패 — export 서버 확인');
      }
    }

    async function exportAll() {
      if (!currentVersionId) {
        showToast('먼저 버전을 저장하세요');
        return;
      }
      showToast('전체 덱 추출 중... (시간 소요)');
      try {
        const res = await fetch(`${API}/capture-all?version=${encodeURIComponent(currentVersionId)}&theme=${currentTheme}&ratio=${encodeURIComponent(currentRatio)}`);
        if (!res.ok) throw new Error(await res.text());
        const result = await res.json();
        showToast(`${result.count}장 추출 완료 → output/`);
      } catch(e) {
        showToast('전체 추출 실패 — export 서버 확인');
      }
    }

    // ══════════════════════════════════════
    //  VERSION MODAL
    // ══════════════════════════════════════
    function openVersionModal() {
      document.getElementById('versionModal').classList.add('open');
      renderVersionList();
      // Default name suggestion
      const now = new Date();
      const yy = String(now.getFullYear()).slice(2);
      const mm = String(now.getMonth()+1).padStart(2,'0');
      const dd = String(now.getDate()).padStart(2,'0');
      document.getElementById('newVersionName').placeholder = `${yy}${mm}${dd}_이름`;
    }

    function closeVersionModal() {
      document.getElementById('versionModal').classList.remove('open');
    }

    function renderVersionList() {
      const list = document.getElementById('versionList');
      if (!versions.length) {
        list.innerHTML = '<li style="color:#666;font-size:12px;padding:8px;">저장된 버전 없음</li>';
        return;
      }

      let html = '';
      versions.forEach(v => {
        const isCurrent = v.id === currentVersionId;
        const date = new Date(v.updatedAt || v.createdAt);
        const dateStr = `${date.getFullYear()}.${String(date.getMonth()+1).padStart(2,'0')}.${String(date.getDate()).padStart(2,'0')}`;
        const slideCount = v.config?.selected?.length || 0;
        const safeId = esc(v.id);
        const safeRatio = esc(v.config?.ratio || '16:9');
        const safeTheme = esc(v.config?.theme || 'dark');
        html += `
          <li class="version-item ${isCurrent ? 'current' : ''}" onclick="loadVersion('${safeId}')">
            <div>
              <div class="version-item-name">${safeId}</div>
              <div class="version-item-meta">${esc(dateStr)} · ${slideCount}장 · ${safeRatio} · ${safeTheme}</div>
            </div>
            <div class="version-item-actions" onclick="event.stopPropagation()">
              <button class="version-item-btn delete" onclick="deleteVersion('${safeId}')">삭제</button>
            </div>
          </li>`;
      });
      list.innerHTML = html;
    }

    // Close modal on backdrop click
    document.getElementById('versionModal').addEventListener('click', (e) => {
      if (e.target === e.currentTarget) closeVersionModal();
    });

    // ══════════════════════════════════════
    //  TOAST
    // ══════════════════════════════════════
    let toastTimer = null;
    function showToast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove('show'), 2500);
    }

    // ══════════════════════════════════════
    //  LOCK SCREEN
    // ══════════════════════════════════════
    async function hashPass(str) {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
    }

    function checkUnlocked() {
      // 로컬 환경에서는 비밀번호 스킵
      if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') return true;
      return false;
    }

    async function tryUnlock(pin) {
      const h = await hashPass(pin);
      // SHA-256 of "5450"
      if (h === 'c54bea44135df61e37bdca547a01c223ff648ddf790677cafe9d30a484cac7c8') {
        document.getElementById('lockScreen').classList.add('loading');
        await init();
        document.getElementById('lockScreen').classList.add('hidden');
      } else {
        const input = document.getElementById('lockInput');
        input.classList.add('error');
        document.getElementById('lockError').textContent = '잘못된 비밀번호';
        input.value = '';
        setTimeout(() => input.classList.remove('error'), 400);
      }
    }

    document.getElementById('lockInput').addEventListener('input', (e) => {
      document.getElementById('lockError').textContent = '';
      if (e.target.value.length === 4) tryUnlock(e.target.value);
    });

    document.getElementById('lockInput').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && e.target.value.length > 0) tryUnlock(e.target.value);
    });

    // ══════════════════════════════════════
    //  BOOT
    // ══════════════════════════════════════
    if (checkUnlocked()) {
      document.getElementById('lockScreen').classList.add('loading');
      init().then(() => {
        document.getElementById('lockScreen').classList.add('hidden');
      });
    }
  </script>
</body>
</html>
