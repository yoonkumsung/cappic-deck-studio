<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CAPP!C Pitch Deck Manager</title>
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/layout.css">
  <link rel="stylesheet" href="styles/cards.css">
  <link rel="stylesheet" href="styles/components.css">
  <link rel="stylesheet" href="styles/utilities.css">
  <style>
    body { background:#000;color:#fff;margin:0;padding:0;min-height:100vh;overflow-x:hidden; }

    /* ── Header ── */
    .header { display:flex;align-items:center;justify-content:space-between;padding:14px 28px;border-bottom:1px solid rgba(255,255,255,0.06);position:sticky;top:0;background:rgba(0,0,0,0.92);backdrop-filter:blur(20px);z-index:100; }
    .header-left { display:flex;align-items:center;gap:14px; }
    .logo { font-size:20px;font-weight:800;letter-spacing:-0.5px; }
    .logo span { color:var(--secondary); }
    .hdiv { width:1px;height:18px;background:rgba(255,255,255,0.1); }
    .version-name { font-size:14px;color:var(--text-tertiary);cursor:pointer;padding:4px 12px;border-radius:6px;border:1px solid rgba(255,255,255,0.08); }
    .version-name:hover { border-color:var(--secondary);color:var(--secondary); }
    .header-actions { display:flex;gap:6px; }

    /* ── Buttons ── */
    .btn { padding:7px 14px;border-radius:8px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.06);color:#fff;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:all 0.15s; }
    .btn:hover { background:rgba(255,255,255,0.12);border-color:rgba(255,255,255,0.2); }
    .btn-primary { background:var(--secondary);color:#000;border-color:var(--secondary); }
    .btn-primary:hover { background:var(--secondary-dark); }
    .btn-accent { background:var(--accent);color:#000;border-color:var(--accent); }
    .btn-accent:hover { background:var(--accent-dark); }
    .btn-sm { padding:4px 10px;font-size:12px; }
    .btn-danger { color:#FF4D6A;border-color:rgba(255,77,106,0.3); }
    .btn-danger:hover { background:rgba(255,77,106,0.1); }

    /* ── Toolbar ── */
    .toolbar { display:flex;align-items:center;justify-content:space-between;padding:10px 28px;border-bottom:1px solid rgba(255,255,255,0.04); }
    .filters { display:flex;gap:5px; }
    .filter-btn { padding:5px 12px;border-radius:20px;border:1px solid rgba(255,255,255,0.08);background:transparent;color:var(--text-tertiary);font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:all 0.15s; }
    .filter-btn:hover { border-color:rgba(255,255,255,0.2);color:#fff; }
    .filter-btn.active { background:rgba(255,255,255,0.1);color:#fff;border-color:rgba(255,255,255,0.2); }
    .filter-btn.priority-high.active { background:rgba(247,225,80,0.15);color:var(--accent);border-color:var(--accent); }
    .filter-btn.priority-mid.active { background:rgba(126,220,230,0.15);color:var(--secondary);border-color:var(--secondary); }
    .slide-count { font-size:14px;color:var(--text-tertiary); }
    .slide-count strong { color:var(--secondary);font-weight:700; }

    /* ── Main Layout ── */
    .main { display:flex;height:calc(100vh - 95px); }
    .panel-grid { flex:1;overflow-y:auto;padding:20px 24px; }
    .panel-editor { width:0;overflow:hidden;transition:width 0.3s;border-left:1px solid rgba(255,255,255,0.06);background:#0a0a0a;display:flex;flex-direction:column; }
    .panel-editor.open { width:55%; }

    /* ── Slide Grid ── */
    .slide-grid { display:grid;grid-template-columns:repeat(auto-fill, minmax(280px, 1fr));gap:14px; }

    /* ── Slide Card ── */
    .slide-card { background:linear-gradient(165deg,#161616,#101010);border:1px solid rgba(255,255,255,0.06);border-radius:12px;padding:16px;cursor:pointer;transition:all 0.2s;position:relative;user-select:none; }
    .slide-card:hover { border-color:rgba(255,255,255,0.15);transform:translateY(-1px);box-shadow:0 6px 20px rgba(0,0,0,0.3); }
    .slide-card.selected { border-color:var(--secondary);box-shadow:0 0 0 1px var(--secondary); }
    .slide-card.selected .card-select { background:var(--secondary);border-color:var(--secondary);color:#000; }
    .slide-card.editing { border-color:var(--accent);box-shadow:0 0 0 1px var(--accent); }
    .card-top { display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px; }
    .card-badges { display:flex;gap:5px; }
    .card-badge { padding:2px 7px;border-radius:4px;font-size:11px;font-weight:700; }
    .priority-badge-high { background:rgba(247,225,80,0.15);color:var(--accent); }
    .priority-badge-mid { background:rgba(126,220,230,0.12);color:var(--secondary); }
    .priority-badge-low { background:rgba(255,255,255,0.06);color:var(--text-tertiary); }
    .card-badge.cat { background:rgba(255,255,255,0.06);color:var(--text-tertiary); }
    .card-btns { display:flex;gap:4px; }
    .card-select { width:22px;height:22px;border-radius:5px;border:2px solid rgba(255,255,255,0.15);background:transparent;display:flex;align-items:center;justify-content:center;font-size:12px;transition:all 0.15s; }
    .card-edit-btn { width:22px;height:22px;border-radius:5px;border:1px solid rgba(255,255,255,0.1);background:transparent;color:var(--text-tertiary);display:flex;align-items:center;justify-content:center;font-size:11px;cursor:pointer;transition:all 0.15s; }
    .card-edit-btn:hover { border-color:var(--accent);color:var(--accent); }
    .card-title { font-size:16px;font-weight:700;color:#fff;margin-bottom:3px; }
    .card-subtitle { font-size:13px;color:var(--text-tertiary);margin-bottom:8px; }
    .card-desc { font-size:13px;color:var(--text-secondary);line-height:1.4; }
    .card-order { position:absolute;bottom:10px;right:14px;font-size:24px;font-weight:800;color:rgba(255,255,255,0.04); }
    .slide-card.selected .card-order { color:rgba(126,220,230,0.15); }

    /* ── Add Slide Card ── */
    .add-card { border:2px dashed rgba(255,255,255,0.08);background:transparent;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;min-height:140px;cursor:pointer;border-radius:12px;transition:all 0.2s; }
    .add-card:hover { border-color:var(--secondary);background:rgba(126,220,230,0.03); }
    .add-card-icon { font-size:28px;color:var(--text-tertiary); }
    .add-card-label { font-size:14px;color:var(--text-tertiary);font-weight:600; }

    /* ── Editor Panel ── */
    .editor-header { padding:16px 20px;border-bottom:1px solid rgba(255,255,255,0.06);display:flex;align-items:center;justify-content:space-between; }
    .editor-title { font-size:16px;font-weight:700; }
    .editor-tabs { display:flex;gap:0;border-bottom:1px solid rgba(255,255,255,0.06); }
    .editor-tab { padding:10px 20px;font-size:14px;font-weight:600;color:var(--text-tertiary);cursor:pointer;border-bottom:2px solid transparent;transition:all 0.15s; }
    .editor-tab:hover { color:#fff; }
    .editor-tab.active { color:var(--secondary);border-bottom-color:var(--secondary); }
    .editor-body { flex:1;overflow-y:auto;padding:20px; }

    /* ── Form Fields ── */
    .form-group { margin-bottom:16px; }
    .form-label { font-size:13px;font-weight:600;color:var(--text-tertiary);margin-bottom:6px;display:block; }
    .form-input { width:100%;padding:10px 14px;border-radius:8px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.04);color:#fff;font-size:15px;font-family:inherit;box-sizing:border-box; }
    .form-input:focus { outline:none;border-color:var(--secondary); }
    .form-textarea { resize:vertical;min-height:80px; }

    /* ── Preview ── */
    .preview-container { padding:16px 20px;border-top:1px solid rgba(255,255,255,0.06);background:#050505; }
    .preview-label { font-size:12px;font-weight:600;color:var(--text-tertiary);letter-spacing:1px;text-transform:uppercase;margin-bottom:10px; }
    .preview-frame { border-radius:8px;overflow:hidden;box-shadow:0 0 0 2px rgba(255,255,255,0.15), 0 0 20px rgba(126,220,230,0.06);border:none; }
    .preview-frame .slide { transform-origin:top left; }

    /* ── Modals ── */
    .modal-overlay { position:fixed;inset:0;background:rgba(0,0,0,0.7);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;z-index:200; }
    .modal-overlay.open { display:flex; }
    .modal { background:#1a1a1a;border:1px solid rgba(255,255,255,0.1);border-radius:16px;padding:24px;width:480px;max-height:80vh;overflow-y:auto; }
    .modal h2 { font-size:18px;font-weight:700;margin-bottom:16px; }
    .modal-input { width:100%;padding:10px 14px;border-radius:8px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.06);color:#fff;font-size:15px;font-family:inherit;margin-bottom:12px;box-sizing:border-box; }
    .modal-input:focus { outline:none;border-color:var(--secondary); }
    .version-list { list-style:none;margin-bottom:12px; }
    .version-item { display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:8px;border:1px solid rgba(255,255,255,0.06);margin-bottom:6px;cursor:pointer;transition:all 0.15s; }
    .version-item:hover { background:rgba(255,255,255,0.04); }
    .version-item-name { font-weight:600;font-size:15px; }
    .version-item-meta { font-size:12px;color:var(--text-tertiary); }
    .modal-actions { display:flex;gap:8px;justify-content:flex-end; }

    /* ── Add Slide Modal ── */
    .template-grid { display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:16px; }
    .template-option { padding:14px;border-radius:8px;border:1px solid rgba(255,255,255,0.08);cursor:pointer;transition:all 0.15s; }
    .template-option:hover { border-color:var(--secondary);background:rgba(126,220,230,0.04); }
    .template-option.selected { border-color:var(--secondary);background:rgba(126,220,230,0.08); }
    .template-option-title { font-size:14px;font-weight:700;margin-bottom:4px; }
    .template-option-desc { font-size:12px;color:var(--text-tertiary); }

    /* ── Toast ── */
    .toast { position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--secondary);color:#000;padding:10px 22px;border-radius:10px;font-weight:700;font-size:14px;transition:transform 0.3s;z-index:300; }
    .toast.show { transform:translateX(-50%) translateY(0); }

    /* priority select */
    .form-select { padding:8px 12px;border-radius:8px;border:1px solid rgba(255,255,255,0.1);background:rgba(255,255,255,0.04);color:#fff;font-size:14px;font-family:inherit; }
    .form-select:focus { outline:none;border-color:var(--secondary); }
    .form-select option { background:#1a1a1a; }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="header-left">
      <div class="logo">CAPP<span>!</span>C Deck</div>
      <div class="hdiv"></div>
      <div class="version-name" id="currentVersion" onclick="openVersionModal()">버전 선택...</div>
    </div>
    <div class="header-actions">
      <button class="btn" onclick="selectAll()">전체 선택</button>
      <button class="btn" onclick="deselectAll()">전체 해제</button>
      <button class="btn" onclick="selectByPriority('상')">상</button>
      <button class="btn" onclick="selectByPriority('상,중')">상+중</button>
      <button class="btn btn-primary" onclick="openVersionModal()">버전 관리</button>
    </div>
  </div>

  <!-- Toolbar -->
  <div class="toolbar">
    <div class="filters">
      <button class="filter-btn active" onclick="setFilter('all',this)">전체</button>
      <button class="filter-btn priority-high" onclick="setFilter('상',this)">상</button>
      <button class="filter-btn priority-mid" onclick="setFilter('중',this)">중</button>
      <button class="filter-btn priority-low" onclick="setFilter('하',this)">하</button>
      <div class="hdiv" style="margin:0 6px;"></div>
      <button class="filter-btn" onclick="setFilter('cat-problem',this)">문제</button>
      <button class="filter-btn" onclick="setFilter('cat-solution',this)">솔루션</button>
      <button class="filter-btn" onclick="setFilter('cat-traction',this)">트랙션</button>
      <button class="filter-btn" onclick="setFilter('cat-business',this)">비즈니스</button>
      <button class="filter-btn" onclick="setFilter('cat-team',this)">팀</button>
    </div>
    <div class="slide-count">
      선택 <strong id="selectedCount">0</strong> / <span id="totalCount">0</span>장
      · 예상 <strong id="estimatedTime">0</strong>분
    </div>
  </div>

  <!-- Main -->
  <div class="main">
    <!-- Left: Grid -->
    <div class="panel-grid">
      <div class="slide-grid" id="slideGrid"></div>
    </div>

    <!-- Right: Editor -->
    <div class="panel-editor" id="editorPanel">
      <div class="editor-header">
        <div class="editor-title" id="editorTitle">슬라이드 편집</div>
        <div style="display:flex;gap:6px;">
          <button class="btn btn-sm btn-accent" onclick="exportCurrentSlide()">PNG 추출</button>
          <button class="btn btn-sm" onclick="closeEditor()">닫기 ×</button>
        </div>
      </div>
      <div class="editor-tabs">
        <div class="editor-tab active" onclick="setEditorTab('form',this)">콘텐츠</div>
        <div class="editor-tab" onclick="setEditorTab('meta',this)">설정</div>
      </div>
      <div class="editor-body" id="editorBody"></div>
      <div class="preview-container">
        <div class="preview-label">미리보기</div>
        <div class="preview-frame" id="previewFrame"></div>
      </div>
    </div>
  </div>

  <!-- Version Modal -->
  <div class="modal-overlay" id="versionModal">
    <div class="modal">
      <h2>버전 관리</h2>
      <div style="margin-bottom:16px;">
        <div style="font-size:13px;color:var(--text-tertiary);margin-bottom:6px;">현재 선택을 새 버전으로 저장</div>
        <div style="display:flex;gap:8px;">
          <input type="text" class="modal-input" id="newVersionName" placeholder="버전 이름 (예: VC 시리즈A용)" style="margin-bottom:0;flex:1;">
          <button class="btn btn-primary" onclick="saveVersion()">저장</button>
        </div>
      </div>
      <div style="font-size:13px;color:var(--text-tertiary);margin-bottom:6px;">저장된 버전</div>
      <ul class="version-list" id="versionList"></ul>
      <div class="modal-actions"><button class="btn" onclick="closeVersionModal()">닫기</button></div>
    </div>
  </div>

  <!-- Add Slide Modal -->
  <div class="modal-overlay" id="addSlideModal">
    <div class="modal">
      <h2>슬라이드 추가</h2>
      <div class="form-group">
        <label class="form-label">슬라이드 ID (영문, 하이픈)</label>
        <input type="text" class="modal-input" id="newSlideId" placeholder="예: solution-demo" style="margin-bottom:0;">
      </div>
      <div class="form-group">
        <label class="form-label">제목</label>
        <input type="text" class="modal-input" id="newSlideTitle" placeholder="예: 솔루션 데모" style="margin-bottom:0;">
      </div>
      <div class="form-group">
        <label class="form-label">서브타이틀</label>
        <input type="text" class="modal-input" id="newSlideSub" placeholder="예: 실제 작동 영상" style="margin-bottom:0;">
      </div>
      <div class="form-group">
        <label class="form-label">카테고리</label>
        <select class="form-select" id="newSlideCat" style="width:100%;">
          <option value="opening">오프닝</option>
          <option value="problem">문제</option>
          <option value="solution" selected>솔루션</option>
          <option value="traction">트랙션</option>
          <option value="business">비즈니스</option>
          <option value="team">팀</option>
          <option value="closing">클로징</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">중요도</label>
        <select class="form-select" id="newSlidePriority" style="width:100%;">
          <option value="상">상</option>
          <option value="중" selected>중</option>
          <option value="하">하</option>
        </select>
      </div>
      <div class="modal-actions">
        <button class="btn" onclick="closeAddSlideModal()">취소</button>
        <button class="btn btn-primary" onclick="addSlide()">추가</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script>
    let slidesData = null;
    let slideDataCache = {};  // id -> {fields, values}
    let slideTemplateCache = {};  // id -> html template string
    let selectedSlides = new Set();
    let currentFilter = 'all';
    let editingSlideId = null;
    let editorTab = 'form';
    const STORAGE_KEY = 'cappic-deck-versions';
    const CURRENT_KEY = 'cappic-deck-current';
    const DATA_KEY = 'cappic-slide-data';

    // ── Init ──
    async function init() {
      const res = await fetch('data/slides.json');
      slidesData = await res.json();

      // Load saved slide data overrides
      const savedData = localStorage.getItem(DATA_KEY);
      if (savedData) slideDataCache = JSON.parse(savedData);

      // Load last session
      const saved = localStorage.getItem(CURRENT_KEY);
      if (saved) {
        const parsed = JSON.parse(saved);
        selectedSlides = new Set(parsed.selected || []);
        document.getElementById('currentVersion').textContent = parsed.name || '버전 선택...';
      }

      document.getElementById('totalCount').textContent = slidesData.slides.length;
      render();
    }

    // ── Load slide data (json) ──
    async function loadSlideData(id) {
      try {
        const res = await fetch(`slides/${id}.json`);
        if (res.ok) {
          const fileData = await res.json();
          // Merge: localStorage overrides per-field, but new fields from file are added
          if (slideDataCache[id]) {
            const cached = slideDataCache[id];
            fileData.fields.forEach(ff => {
              const cf = cached.fields.find(c => c.key === ff.key);
              if (cf) {
                ff.value = cf.value || ff.value; // use cached if non-empty, else file default
              }
            });
          }
          slideDataCache[id] = fileData;
          return fileData;
        }
      } catch(e) {}
      if (slideDataCache[id]) return slideDataCache[id];
      return null;
    }

    // ── Load slide template (html) ──
    async function loadSlideTemplate(id) {
      if (slideTemplateCache[id]) return slideTemplateCache[id];
      try {
        const res = await fetch(`slides/${id}.html`);
        if (res.ok) {
          const html = await res.text();
          slideTemplateCache[id] = html;
          return html;
        }
      } catch(e) {}
      return null;
    }

    // ── Render slide with data ──
    function renderSlideHtml(template, fields) {
      let html = template;
      if (fields) {
        fields.forEach(f => {
          const regex = new RegExp('\\{\\{' + f.key + '\\}\\}', 'g');
          html = html.replace(regex, f.value || '');
        });
      }
      return html;
    }

    // ── Render Grid ──
    function render() {
      const grid = document.getElementById('slideGrid');
      const filtered = slidesData.slides.filter(s => {
        if (currentFilter === 'all') return true;
        if (['상','중','하'].includes(currentFilter)) return s.priority === currentFilter;
        if (currentFilter.startsWith('cat-')) return s.category === currentFilter.replace('cat-','');
        return true;
      });

      grid.innerHTML = filtered.map(slide => {
        const sel = selectedSlides.has(slide.id);
        const ord = sel ? [...selectedSlides].indexOf(slide.id) + 1 : '';
        const cat = slidesData.categories[slide.category];
        const pc = slide.priority === '상' ? 'priority-badge-high' : slide.priority === '중' ? 'priority-badge-mid' : 'priority-badge-low';
        const editing = editingSlideId === slide.id;

        return `
          <div class="slide-card ${sel?'selected':''} ${editing?'editing':''}" data-id="${slide.id}">
            <div class="card-top">
              <div class="card-badges">
                <span class="card-badge ${pc}">${slide.priority}</span>
                <span class="card-badge cat" style="color:${cat.color}">${cat.label}</span>
              </div>
              <div class="card-btns">
                <div class="card-edit-btn" onclick="event.stopPropagation();openEditor('${slide.id}')" title="편집">&#9998;</div>
                <div class="card-select" onclick="event.stopPropagation();toggleSlide('${slide.id}')">${sel?'✓':''}</div>
              </div>
            </div>
            <div class="card-title" onclick="openEditor('${slide.id}')">${slide.title}</div>
            <div class="card-subtitle">${slide.subtitle}</div>
            <div class="card-desc">${slide.description}</div>
            ${ord ? `<div class="card-order">${String(ord).padStart(2,'0')}</div>` : ''}
          </div>`;
      }).join('') + `
        <div class="add-card" onclick="openAddSlideModal()">
          <div class="add-card-icon">+</div>
          <div class="add-card-label">슬라이드 추가</div>
        </div>`;

      updateCounts();
    }

    // ── Editor ──
    async function openEditor(id) {
      editingSlideId = id;
      const slide = slidesData.slides.find(s => s.id === id);
      document.getElementById('editorTitle').textContent = slide.title;
      document.getElementById('editorPanel').classList.add('open');
      editorTab = 'form';
      document.querySelectorAll('.editor-tab').forEach((t,i) => t.classList.toggle('active', i===0));
      await renderEditorBody();
      render();
    }

    function closeEditor() {
      editingSlideId = null;
      document.getElementById('editorPanel').classList.remove('open');
      render();
    }

    function setEditorTab(tab, el) {
      editorTab = tab;
      document.querySelectorAll('.editor-tab').forEach(t => t.classList.remove('active'));
      el.classList.add('active');
      renderEditorBody();
    }

    async function renderEditorBody() {
      const body = document.getElementById('editorBody');
      const slide = slidesData.slides.find(s => s.id === editingSlideId);
      if (!slide) return;

      if (editorTab === 'meta') {
        // Meta editor: title, subtitle, description, priority, category
        body.innerHTML = `
          <div class="form-group">
            <label class="form-label">제목</label>
            <input class="form-input" value="${slide.title}" onchange="updateSlideMeta('title',this.value)">
          </div>
          <div class="form-group">
            <label class="form-label">서브타이틀</label>
            <input class="form-input" value="${slide.subtitle}" onchange="updateSlideMeta('subtitle',this.value)">
          </div>
          <div class="form-group">
            <label class="form-label">설명</label>
            <textarea class="form-input form-textarea" onchange="updateSlideMeta('description',this.value)">${slide.description}</textarea>
          </div>
          <div class="form-group">
            <label class="form-label">중요도</label>
            <select class="form-select" onchange="updateSlideMeta('priority',this.value)">
              <option value="상" ${slide.priority==='상'?'selected':''}>상</option>
              <option value="중" ${slide.priority==='중'?'selected':''}>중</option>
              <option value="하" ${slide.priority==='하'?'selected':''}>하</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">카테고리</label>
            <select class="form-select" onchange="updateSlideMeta('category',this.value)">
              ${Object.entries(slidesData.categories).map(([k,v]) =>
                `<option value="${k}" ${slide.category===k?'selected':''}>${v.label}</option>`
              ).join('')}
            </select>
          </div>
          <div class="form-group">
            <button class="btn btn-danger" onclick="deleteSlide('${slide.id}')">이 슬라이드 삭제</button>
          </div>`;
        return;
      }

      // Content form
      const data = await loadSlideData(editingSlideId);
      if (!data || !data.fields) {
        body.innerHTML = `
          <div style="color:var(--text-tertiary);padding:20px;text-align:center;">
            <div style="font-size:32px;margin-bottom:12px;">📝</div>
            <div style="font-size:15px;margin-bottom:8px;">이 슬라이드의 HTML 템플릿이 아직 없습니다</div>
            <div style="font-size:13px;color:var(--text-source);">Claude Code에서 slides/${editingSlideId}.html과 slides/${editingSlideId}.json을 만들어주세요</div>
          </div>`;
        document.getElementById('previewFrame').innerHTML = '';
        return;
      }

      body.innerHTML = data.fields.map(f => `
        <div class="form-group">
          <label class="form-label">${f.label}</label>
          ${f.type === 'textarea'
            ? `<textarea class="form-input form-textarea" data-key="${f.key}" oninput="updateField('${f.key}',this.value)">${f.value||''}</textarea>`
            : `<input class="form-input" type="text" data-key="${f.key}" value="${f.value||''}" oninput="updateField('${f.key}',this.value)">`
          }
        </div>`).join('');

      updatePreview();
    }

    function updateField(key, value) {
      const data = slideDataCache[editingSlideId];
      if (!data) return;
      const field = data.fields.find(f => f.key === key);
      if (field) field.value = value;
      localStorage.setItem(DATA_KEY, JSON.stringify(slideDataCache));
      updatePreview();
    }

    function updateSlideMeta(prop, value) {
      const slide = slidesData.slides.find(s => s.id === editingSlideId);
      if (slide) {
        slide[prop] = value;
        document.getElementById('editorTitle').textContent = slide.title;
        render();
      }
    }

    async function updatePreview() {
      const template = await loadSlideTemplate(editingSlideId);
      const data = slideDataCache[editingSlideId];
      const frame = document.getElementById('previewFrame');

      if (!template) {
        frame.innerHTML = '';
        frame.style.height = 'auto';
        return;
      }

      const html = renderSlideHtml(template, data?.fields);
      const containerWidth = frame.parentElement.clientWidth - 40;
      const scale = containerWidth / 1920;
      // 16:9 비율 고정
      frame.style.width = containerWidth + 'px';
      frame.style.height = (containerWidth * 9 / 16) + 'px';
      frame.style.position = 'relative';
      frame.style.overflow = 'hidden';
      frame.innerHTML = `<div style="transform:scale(${scale});transform-origin:top left;width:1920px;height:1080px;background:#000;position:absolute;top:0;left:0;font-family:var(--font-family);">${html}</div>`;
    }

    // ── Slide CRUD ──
    function toggleSlide(id) {
      selectedSlides.has(id) ? selectedSlides.delete(id) : selectedSlides.add(id);
      render(); saveCurrent();
    }
    function selectAll() { slidesData.slides.forEach(s => selectedSlides.add(s.id)); render(); saveCurrent(); }
    function deselectAll() { selectedSlides.clear(); render(); saveCurrent(); }
    function selectByPriority(p) {
      selectedSlides.clear();
      p.split(',').forEach(pr => slidesData.slides.forEach(s => { if(s.priority===pr) selectedSlides.add(s.id); }));
      render(); saveCurrent();
    }

    function addSlide() {
      const id = document.getElementById('newSlideId').value.trim();
      const title = document.getElementById('newSlideTitle').value.trim();
      const sub = document.getElementById('newSlideSub').value.trim();
      const cat = document.getElementById('newSlideCat').value;
      const priority = document.getElementById('newSlidePriority').value;
      if (!id || !title) { showToast('ID와 제목을 입력하세요'); return; }
      if (slidesData.slides.find(s => s.id === id)) { showToast('이미 존재하는 ID입니다'); return; }

      slidesData.slides.push({ id, title, subtitle: sub || '', priority, category: cat, description: '' });
      document.getElementById('totalCount').textContent = slidesData.slides.length;
      closeAddSlideModal();
      render();
      showToast(`"${title}" 슬라이드 추가됨`);
    }

    function deleteSlide(id) {
      if (!confirm('이 슬라이드를 삭제할까요?')) return;
      slidesData.slides = slidesData.slides.filter(s => s.id !== id);
      selectedSlides.delete(id);
      document.getElementById('totalCount').textContent = slidesData.slides.length;
      closeEditor();
      render();
      showToast('슬라이드 삭제됨');
    }

    // ── Filter ──
    function setFilter(f, el) {
      currentFilter = f;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      el.classList.add('active');
      render();
    }

    // ── Counts ──
    function updateCounts() {
      const c = selectedSlides.size;
      document.getElementById('selectedCount').textContent = c;
      document.getElementById('estimatedTime').textContent = Math.round(c * 40 / 60);
    }

    // ── Versions ──
    function getVersions() { return JSON.parse(localStorage.getItem(STORAGE_KEY)||'[]'); }
    function saveVersion() {
      const name = document.getElementById('newVersionName').value.trim();
      if (!name) return;
      const versions = getVersions();
      const i = versions.findIndex(v => v.name===name);
      const entry = { name, selected:[...selectedSlides], createdAt:new Date().toISOString(), slideCount:selectedSlides.size };
      i >= 0 ? versions[i]=entry : versions.push(entry);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(versions));
      document.getElementById('newVersionName').value = '';
      document.getElementById('currentVersion').textContent = name;
      saveCurrent(name); renderVersionList(); showToast(`"${name}" 저장 완료`);
    }
    function loadVersion(name) {
      const v = getVersions().find(v => v.name===name);
      if (!v) return;
      selectedSlides = new Set(v.selected);
      document.getElementById('currentVersion').textContent = name;
      saveCurrent(name); closeVersionModal(); render(); showToast(`"${name}" 불러옴`);
    }
    function deleteVersion(name) {
      if (!confirm(`"${name}" 삭제?`)) return;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(getVersions().filter(v => v.name!==name)));
      renderVersionList(); showToast(`삭제됨`);
    }
    function saveCurrent(name) {
      localStorage.setItem(CURRENT_KEY, JSON.stringify({ name: name||document.getElementById('currentVersion').textContent, selected:[...selectedSlides] }));
    }

    // ── Modals ──
    function openVersionModal() { document.getElementById('versionModal').classList.add('open'); renderVersionList(); }
    function closeVersionModal() { document.getElementById('versionModal').classList.remove('open'); }
    function openAddSlideModal() { document.getElementById('addSlideModal').classList.add('open'); }
    function closeAddSlideModal() { document.getElementById('addSlideModal').classList.remove('open'); }

    function renderVersionList() {
      const versions = getVersions();
      const list = document.getElementById('versionList');
      list.innerHTML = versions.length === 0
        ? '<div style="color:var(--text-tertiary);font-size:13px;padding:10px;">저장된 버전이 없습니다</div>'
        : versions.map(v => `
          <li class="version-item" onclick="loadVersion('${v.name}')">
            <div>
              <div class="version-item-name">${v.name}</div>
              <div class="version-item-meta">${v.slideCount}장 · ${new Date(v.createdAt).toLocaleDateString('ko-KR')}</div>
            </div>
            <div onclick="event.stopPropagation()"><button class="btn btn-sm btn-danger" onclick="deleteVersion('${v.name}')">삭제</button></div>
          </li>`).join('');
    }

    // ── Export Current Slide as PNG ──
    async function exportCurrentSlide() {
      if (!editingSlideId) return;
      const template = await loadSlideTemplate(editingSlideId);
      const data = slideDataCache[editingSlideId];
      if (!template) { showToast('HTML 템플릿이 없습니다'); return; }

      showToast('추출 중...');

      const html = renderSlideHtml(template, data?.fields);

      // Create offscreen iframe at full 1920x1080
      const iframe = document.createElement('iframe');
      iframe.style.cssText = 'position:fixed;top:-10000px;left:-10000px;width:1920px;height:1080px;border:none;';
      document.body.appendChild(iframe);

      const doc = iframe.contentDocument;
      doc.open();
      doc.write(`<!DOCTYPE html>
<html><head>
<link rel="stylesheet" href="styles/tokens.css">
<link rel="stylesheet" href="styles/layout.css">
<link rel="stylesheet" href="styles/cards.css">
<link rel="stylesheet" href="styles/components.css">
<link rel="stylesheet" href="styles/utilities.css">
<style>
  html,body { margin:0;padding:0;width:1920px;height:1080px;overflow:hidden;background:#000; }
</style>
</head><body>${html}</body></html>`);
      doc.close();

      // Wait for fonts/images to load
      await new Promise(r => setTimeout(r, 1500));

      try {
        // Use html2canvas via CDN
        if (!window.html2canvas) {
          const script = document.createElement('script');
          script.src = 'https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js';
          document.head.appendChild(script);
          await new Promise(r => script.onload = r);
        }

        const canvas = await html2canvas(doc.body, {
          width: 1920,
          height: 1080,
          scale: 4,  // 4x = 7680x4320 (8K)
          useCORS: true,
          backgroundColor: '#000000',
          logging: false
        });

        // Download
        const link = document.createElement('a');
        link.download = `${editingSlideId}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();

        showToast('추출 완료');
      } catch(e) {
        console.error(e);
        showToast('추출 실패: ' + e.message);
      } finally {
        document.body.removeChild(iframe);
      }
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg; t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2000);
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') { closeVersionModal(); closeAddSlideModal(); }
    });
    document.querySelectorAll('.modal-overlay').forEach(m => m.addEventListener('click', e => { if(e.target===e.currentTarget) { closeVersionModal(); closeAddSlideModal(); }}));

    init();
  </script>
</body>
</html>
