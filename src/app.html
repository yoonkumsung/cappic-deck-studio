<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CAPP!C Pitch Deck Manager</title>
  <link rel="stylesheet" href="styles/tokens.css">
  <style>
    body {
      background: #000;
      color: #fff;
      margin: 0;
      padding: 0;
      min-height: 100vh;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 32px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      position: sticky;
      top: 0;
      background: rgba(0,0,0,0.9);
      backdrop-filter: blur(20px);
      z-index: 100;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .logo {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .logo span { color: var(--secondary); }
    .header-divider {
      width: 1px;
      height: 20px;
      background: rgba(255,255,255,0.12);
    }
    .version-name {
      font-size: 15px;
      color: var(--text-tertiary);
      cursor: pointer;
      padding: 4px 12px;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.08);
    }
    .version-name:hover {
      border-color: var(--secondary);
      color: var(--secondary);
    }
    .header-actions {
      display: flex;
      gap: 8px;
    }

    /* ── Buttons ── */
    .btn {
      padding: 8px 16px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.06);
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.15s;
    }
    .btn:hover {
      background: rgba(255,255,255,0.12);
      border-color: rgba(255,255,255,0.2);
    }
    .btn-primary {
      background: var(--secondary);
      color: #000;
      border-color: var(--secondary);
    }
    .btn-primary:hover {
      background: var(--secondary-dark);
    }
    .btn-accent {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
    }
    .btn-accent:hover {
      background: var(--accent-dark);
    }
    .btn-sm {
      padding: 5px 10px;
      font-size: 13px;
    }

    /* ── Toolbar ── */
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 32px;
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }
    .filters {
      display: flex;
      gap: 6px;
    }
    .filter-btn {
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.08);
      background: transparent;
      color: var(--text-tertiary);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.15s;
    }
    .filter-btn:hover { border-color: rgba(255,255,255,0.2); color: #fff; }
    .filter-btn.active { background: rgba(255,255,255,0.1); color: #fff; border-color: rgba(255,255,255,0.2); }
    .filter-btn.priority-high.active { background: rgba(247,225,80,0.15); color: var(--accent); border-color: var(--accent); }
    .filter-btn.priority-mid.active { background: rgba(126,220,230,0.15); color: var(--secondary); border-color: var(--secondary); }
    .filter-btn.priority-low.active { background: rgba(255,255,255,0.08); color: var(--text-secondary); }

    .slide-count {
      font-size: 15px;
      color: var(--text-tertiary);
    }
    .slide-count strong {
      color: var(--secondary);
      font-weight: 700;
    }

    /* ── Slide Grid ── */
    .slide-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 16px;
      padding: 24px 32px;
    }

    /* ── Slide Card ── */
    .slide-card {
      background: linear-gradient(165deg, #161616, #101010);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 14px;
      padding: 20px;
      cursor: pointer;
      transition: all 0.2s;
      position: relative;
      user-select: none;
    }
    .slide-card:hover {
      border-color: rgba(255,255,255,0.15);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    }
    .slide-card.selected {
      border-color: var(--secondary);
      box-shadow: 0 0 0 1px var(--secondary), 0 8px 24px rgba(126,220,230,0.1);
    }
    .slide-card.selected .card-select {
      background: var(--secondary);
      border-color: var(--secondary);
      color: #000;
    }

    .card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .card-badges {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .card-badge {
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 700;
      line-height: 1.3;
    }
    .card-badge.cat {
      background: rgba(255,255,255,0.06);
      color: var(--text-tertiary);
    }
    .priority-badge-high {
      background: rgba(247,225,80,0.15);
      color: var(--accent);
    }
    .priority-badge-mid {
      background: rgba(126,220,230,0.12);
      color: var(--secondary);
    }
    .priority-badge-low {
      background: rgba(255,255,255,0.06);
      color: var(--text-tertiary);
    }

    .card-select {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      border: 2px solid rgba(255,255,255,0.15);
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 14px;
      transition: all 0.15s;
    }

    .card-title {
      font-size: 18px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 4px;
    }
    .card-subtitle {
      font-size: 14px;
      color: var(--text-tertiary);
      margin-bottom: 10px;
    }
    .card-desc {
      font-size: 14px;
      color: var(--text-secondary);
      line-height: 1.5;
    }

    .card-order {
      position: absolute;
      bottom: 12px;
      right: 16px;
      font-size: 28px;
      font-weight: 800;
      color: rgba(255,255,255,0.04);
      line-height: 1;
    }
    .slide-card.selected .card-order {
      color: rgba(126,220,230,0.15);
    }

    /* ── Version Modal ── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 200;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: #1a1a1a;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      padding: 28px;
      width: 480px;
      max-height: 80vh;
      overflow-y: auto;
    }
    .modal h2 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 20px;
    }
    .modal-input {
      width: 100%;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.1);
      background: rgba(255,255,255,0.06);
      color: #fff;
      font-size: 16px;
      font-family: inherit;
      margin-bottom: 16px;
    }
    .modal-input:focus {
      outline: none;
      border-color: var(--secondary);
    }
    .version-list {
      list-style: none;
      margin-bottom: 16px;
    }
    .version-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.06);
      margin-bottom: 8px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .version-item:hover {
      background: rgba(255,255,255,0.04);
      border-color: rgba(255,255,255,0.12);
    }
    .version-item-name {
      font-weight: 600;
      font-size: 16px;
    }
    .version-item-meta {
      font-size: 13px;
      color: var(--text-tertiary);
    }
    .version-item-actions {
      display: flex;
      gap: 6px;
    }
    .btn-danger {
      color: #FF4D6A;
      border-color: rgba(255,77,106,0.3);
    }
    .btn-danger:hover {
      background: rgba(255,77,106,0.1);
    }

    .modal-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }

    /* ── Toast ── */
    .toast {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--secondary);
      color: #000;
      padding: 12px 24px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 15px;
      transition: transform 0.3s;
      z-index: 300;
    }
    .toast.show {
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="header-left">
      <div class="logo">CAPP<span>!</span>C Deck</div>
      <div class="header-divider"></div>
      <div class="version-name" id="currentVersion" onclick="openVersionModal()">버전 선택...</div>
    </div>
    <div class="header-actions">
      <button class="btn" onclick="selectAll()">전체 선택</button>
      <button class="btn" onclick="deselectAll()">전체 해제</button>
      <button class="btn" onclick="selectByPriority('상')">상 전체</button>
      <button class="btn" onclick="selectByPriority('상,중')">상+중</button>
      <button class="btn btn-primary" onclick="openVersionModal()">버전 관리</button>
    </div>
  </div>

  <!-- Toolbar -->
  <div class="toolbar">
    <div class="filters">
      <button class="filter-btn active" data-filter="all" onclick="setFilter('all', this)">전체</button>
      <button class="filter-btn priority-high" data-filter="상" onclick="setFilter('상', this)">상</button>
      <button class="filter-btn priority-mid" data-filter="중" onclick="setFilter('중', this)">중</button>
      <button class="filter-btn priority-low" data-filter="하" onclick="setFilter('하', this)">하</button>
      <div class="header-divider" style="margin:0 8px;"></div>
      <button class="filter-btn" data-filter="cat-problem" onclick="setFilter('cat-problem', this)">문제</button>
      <button class="filter-btn" data-filter="cat-solution" onclick="setFilter('cat-solution', this)">솔루션</button>
      <button class="filter-btn" data-filter="cat-traction" onclick="setFilter('cat-traction', this)">트랙션</button>
      <button class="filter-btn" data-filter="cat-business" onclick="setFilter('cat-business', this)">비즈니스</button>
      <button class="filter-btn" data-filter="cat-team" onclick="setFilter('cat-team', this)">팀</button>
    </div>
    <div class="slide-count">
      선택 <strong id="selectedCount">0</strong> / <span id="totalCount">0</span>장
      · 예상 <strong id="estimatedTime">0</strong>분
    </div>
  </div>

  <!-- Slide Grid -->
  <div class="slide-grid" id="slideGrid"></div>

  <!-- Version Modal -->
  <div class="modal-overlay" id="versionModal">
    <div class="modal">
      <h2>버전 관리</h2>

      <div style="margin-bottom:20px;">
        <div style="font-size:15px;color:var(--text-tertiary);margin-bottom:8px;">현재 선택을 새 버전으로 저장</div>
        <div style="display:flex;gap:8px;">
          <input type="text" class="modal-input" id="newVersionName" placeholder="버전 이름 (예: VC 시리즈A용)" style="margin-bottom:0;flex:1;">
          <button class="btn btn-primary" onclick="saveVersion()">저장</button>
        </div>
      </div>

      <div style="font-size:15px;color:var(--text-tertiary);margin-bottom:8px;">저장된 버전</div>
      <ul class="version-list" id="versionList"></ul>

      <div class="modal-actions">
        <button class="btn" onclick="closeVersionModal()">닫기</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script>
    let slidesData = null;
    let selectedSlides = new Set();
    let currentFilter = 'all';
    const STORAGE_KEY = 'cappic-deck-versions';
    const CURRENT_KEY = 'cappic-deck-current';

    // ── Init ──
    async function init() {
      const res = await fetch('data/slides.json');
      slidesData = await res.json();
      document.getElementById('totalCount').textContent = slidesData.slides.length;

      // Load last session
      const saved = localStorage.getItem(CURRENT_KEY);
      if (saved) {
        const parsed = JSON.parse(saved);
        selectedSlides = new Set(parsed.selected || []);
        document.getElementById('currentVersion').textContent = parsed.name || '버전 선택...';
      }

      render();
    }

    // ── Render ──
    function render() {
      const grid = document.getElementById('slideGrid');
      const filtered = slidesData.slides.filter(s => {
        if (currentFilter === 'all') return true;
        if (currentFilter === '상' || currentFilter === '중' || currentFilter === '하') return s.priority === currentFilter;
        if (currentFilter.startsWith('cat-')) return s.category === currentFilter.replace('cat-', '');
        return true;
      });

      grid.innerHTML = filtered.map((slide, i) => {
        const isSelected = selectedSlides.has(slide.id);
        const orderNum = isSelected ? [...selectedSlides].indexOf(slide.id) + 1 : '';
        const cat = slidesData.categories[slide.category];
        const prClass = slide.priority === '상' ? 'priority-badge-high' : slide.priority === '중' ? 'priority-badge-mid' : 'priority-badge-low';

        return `
          <div class="slide-card ${isSelected ? 'selected' : ''}" onclick="toggleSlide('${slide.id}')">
            <div class="card-top">
              <div class="card-badges">
                <span class="card-badge ${prClass}">${slide.priority}</span>
                <span class="card-badge cat" style="color:${cat.color};">${cat.label}</span>
              </div>
              <div class="card-select">${isSelected ? '✓' : ''}</div>
            </div>
            <div class="card-title">${slide.title}</div>
            <div class="card-subtitle">${slide.subtitle}</div>
            <div class="card-desc">${slide.description}</div>
            ${orderNum ? `<div class="card-order">${String(orderNum).padStart(2, '0')}</div>` : ''}
          </div>
        `;
      }).join('');

      updateCounts();
    }

    // ── Toggle Slide ──
    function toggleSlide(id) {
      if (selectedSlides.has(id)) {
        selectedSlides.delete(id);
      } else {
        selectedSlides.add(id);
      }
      render();
      saveCurrent();
    }

    // ── Select Helpers ──
    function selectAll() {
      slidesData.slides.forEach(s => selectedSlides.add(s.id));
      render();
      saveCurrent();
    }

    function deselectAll() {
      selectedSlides.clear();
      render();
      saveCurrent();
    }

    function selectByPriority(priorities) {
      selectedSlides.clear();
      const ps = priorities.split(',');
      slidesData.slides.forEach(s => {
        if (ps.includes(s.priority)) selectedSlides.add(s.id);
      });
      render();
      saveCurrent();
    }

    // ── Filter ──
    function setFilter(filter, el) {
      currentFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      el.classList.add('active');
      render();
    }

    // ── Counts ──
    function updateCounts() {
      const count = selectedSlides.size;
      document.getElementById('selectedCount').textContent = count;
      document.getElementById('estimatedTime').textContent = Math.round(count * 40 / 60);
    }

    // ── Version Management ──
    function getVersions() {
      return JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
    }

    function saveVersion() {
      const name = document.getElementById('newVersionName').value.trim();
      if (!name) return;

      const versions = getVersions();
      const existing = versions.findIndex(v => v.name === name);
      const entry = {
        name,
        selected: [...selectedSlides],
        slideOrder: [...selectedSlides],
        createdAt: new Date().toISOString(),
        slideCount: selectedSlides.size
      };

      if (existing >= 0) {
        versions[existing] = entry;
      } else {
        versions.push(entry);
      }

      localStorage.setItem(STORAGE_KEY, JSON.stringify(versions));
      document.getElementById('newVersionName').value = '';
      document.getElementById('currentVersion').textContent = name;
      saveCurrent(name);
      renderVersionList();
      showToast(`"${name}" 버전 저장 완료`);
    }

    function loadVersion(name) {
      const versions = getVersions();
      const v = versions.find(v => v.name === name);
      if (!v) return;

      selectedSlides = new Set(v.selected);
      document.getElementById('currentVersion').textContent = name;
      saveCurrent(name);
      closeVersionModal();
      render();
      showToast(`"${name}" 버전 불러옴`);
    }

    function deleteVersion(name) {
      if (!confirm(`"${name}" 버전을 삭제할까요?`)) return;
      const versions = getVersions().filter(v => v.name !== name);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(versions));
      renderVersionList();
      showToast(`"${name}" 삭제됨`);
    }

    function saveCurrent(name) {
      localStorage.setItem(CURRENT_KEY, JSON.stringify({
        name: name || document.getElementById('currentVersion').textContent,
        selected: [...selectedSlides]
      }));
    }

    // ── Modal ──
    function openVersionModal() {
      document.getElementById('versionModal').classList.add('open');
      renderVersionList();
    }

    function closeVersionModal() {
      document.getElementById('versionModal').classList.remove('open');
    }

    function renderVersionList() {
      const versions = getVersions();
      const list = document.getElementById('versionList');

      if (versions.length === 0) {
        list.innerHTML = '<div style="color:var(--text-tertiary);font-size:14px;padding:12px;">저장된 버전이 없습니다</div>';
        return;
      }

      list.innerHTML = versions.map(v => `
        <li class="version-item" onclick="loadVersion('${v.name}')">
          <div>
            <div class="version-item-name">${v.name}</div>
            <div class="version-item-meta">${v.slideCount}장 · ${new Date(v.createdAt).toLocaleDateString('ko-KR')}</div>
          </div>
          <div class="version-item-actions" onclick="event.stopPropagation()">
            <button class="btn btn-sm btn-danger" onclick="deleteVersion('${v.name}')">삭제</button>
          </div>
        </li>
      `).join('');
    }

    // ── Toast ──
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2000);
    }

    // ── Keyboard shortcuts ──
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeVersionModal();
    });

    // ── Click outside modal ──
    document.getElementById('versionModal').addEventListener('click', e => {
      if (e.target === e.currentTarget) closeVersionModal();
    });

    init();
  </script>
</body>
</html>
