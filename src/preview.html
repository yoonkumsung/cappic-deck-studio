<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>CAPP!C Deck Studio — Preview</title>
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/layout.css">
  <link rel="stylesheet" href="styles/cards.css">
  <link rel="stylesheet" href="styles/components.css">
  <link rel="stylesheet" href="styles/utilities.css">
  <link rel="stylesheet" href="styles/slide-grid.css">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <div id="slideRoot"></div>
  <script>
    // Block direct access (only allow from iframe or localhost)
    if (window.top === window.self && !location.hostname.match(/^(localhost|127\.0\.0\.1)$/)) {
      if (sessionStorage.getItem('deck_unlocked') !== 'true') {
        document.body.innerHTML = '';
        window.location.href = 'app.html';
        throw new Error('unauthorized');
      }
    }

    const params = new URLSearchParams(window.location.search);
    const slideId = params.get('slide');
    const theme = params.get('theme') || 'dark';
    const ratio = params.get('ratio') || '16:9';

    // ── Ratio → viewport dimensions ──
    const RATIOS = {
      '16:9': { w: 1920, h: 1080 },
      '3:2':  { w: 1620, h: 1080 },
    };

    const dim = RATIOS[ratio] || RATIOS['16:9'];

    // Set viewport size
    document.documentElement.style.width = dim.w + 'px';
    document.documentElement.style.height = dim.h + 'px';
    document.body.style.width = dim.w + 'px';
    document.body.style.height = dim.h + 'px';

    // Set data-ratio attribute for CSS targeting
    document.documentElement.setAttribute('data-ratio', ratio);

    // ── Light theme tokens ──
    const LIGHT_THEME = {
      // 배경: 흰색 계열
      '--main-black':'#FFFFFF','--main-dark':'#F5F5F5','--main-dark-mid':'#EEEEEE','--main-dark-light':'#E5E5E5',
      // 텍스트: 검정 계열 (다크모드 흰색 → 라이트모드 검정)
      '--text-primary':'#111111','--text-secondary':'#333333','--text-tertiary':'#888888',
      // 시안: 더 진하게 (흰 배경에서 가독성)
      '--secondary':'#0A7A88','--secondary-dark':'#066570',
      // 노란색: 훨씬 진하게 (흰 배경에서 가독성 — 다크 골드)
      '--accent':'#CC6600','--accent-dark':'#A85500',
      // 시맨틱: 진하게
      '--semantic-up':'#1A7A10','--semantic-down':'#C01030',
      // 카드: 밝은 회색 배경 (흰 배경과 구분)
      '--card-default':'linear-gradient(165deg, #F8F8F8 0%, #F2F2F2 50%, #EEEEEE 100%)',
      '--card-elevated':'linear-gradient(165deg, #FFFFFF 0%, #F8F8F8 50%, #F5F5F5 100%)',
      '--card-secondary':'linear-gradient(165deg, rgba(10,122,136,0.10) 0%, rgba(10,122,136,0.05) 50%, rgba(10,122,136,0.02) 100%)',
      '--card-accent':'linear-gradient(165deg, rgba(204,102,0,0.10) 0%, rgba(204,102,0,0.05) 50%, rgba(204,102,0,0.02) 100%)',
      '--card-shadow':'0 1px 4px rgba(0,0,0,0.06), 0 4px 12px rgba(0,0,0,0.04)',
      '--card-border':'1px solid rgba(0,0,0,0.10)',
    };

    // ── Apply theme ──
    function applyTheme() {
      document.documentElement.setAttribute('data-theme', theme);
      if (theme === 'light') {
        Object.entries(LIGHT_THEME).forEach(([k,v]) => document.documentElement.style.setProperty(k,v));
        document.body.style.background = '#FFFFFF';
      } else {
        document.body.style.background = '#000';
      }
    }

    // ── Apply ratio overrides ──
    function applyRatio() {
      const r = document.documentElement;
      if (ratio === '3:2') {
        r.style.setProperty('--slide-w', '1620px');
        r.style.setProperty('--slide-h', '1080px');
        r.style.setProperty('--slide-pad-side', '100px');
      }
      // 16:9 uses defaults from tokens.css
    }

    // ── Apply token overrides from URL (passed as base64 JSON) ──
    function applyTokenOverrides() {
      const overrides = params.get('tokens');
      if (!overrides) return;
      try {
        const pxTokens = ['--fs-display','--fs-stat','--fs-heading','--fs-body','--fs-caption','--fs-source',
                          '--sp-xs','--sp-sm','--sp-md','--sp-lg','--sp-xl','--card-radius'];
        const tokens = JSON.parse(atob(overrides));
        Object.entries(tokens).forEach(([k,v]) => {
          document.documentElement.style.setProperty(k, pxTokens.includes(k) ? v+'px' : v);
        });
      } catch(e) {}
    }

    applyTheme();
    applyRatio();
    applyTokenOverrides();

    // ── Render slide ──
    async function render() {
      if (!slideId) return;

      const tplRes = await fetch(`slides/${slideId}.html`);
      if (!tplRes.ok) {
        const errDiv = document.createElement('div');
        errDiv.style.cssText = 'color:red;padding:40px;';
        errDiv.textContent = 'Template not found: ' + slideId;
        document.body.appendChild(errDiv);
        return;
      }
      let html = await tplRes.text();

      // Load data and replace placeholders + apply styles (single fetch)
      let jsonData = null;
      try {
        const dataRes = await fetch(`slides/${slideId}.json`);
        if (dataRes.ok) {
          jsonData = await dataRes.json();
          jsonData.fields.forEach(f => {
            const regex = new RegExp('\\{\\{' + f.key + '\\}\\}', 'g');
            html = html.replace(regex, f.value || '');
          });
        }
      } catch(e) {}

      document.getElementById('slideRoot').innerHTML = html;

      // Apply per-slide styles from JSON _styles field
      if (jsonData && jsonData._styles) {
        const root = document.getElementById('slideRoot').firstElementChild;
        if (root) {
          Object.entries(jsonData._styles).forEach(([k, v]) => {
            if (k.startsWith('--') && k !== '--title-align') {
              root.style.setProperty(k, v);
            }
          });
          if (jsonData._styles['--title-align'] === 'center') {
            const title = root.querySelector('.slide-title');
            if (title) title.classList.add('center');
          }
        }
      }
    }

    render();
  </script>
</body>
</html>
