<div class="slide">
  <div class="slide-title">{{title}}</div>

  <div class="slide-content sg-cols-4">

    <!-- Region 1: Japan -->
    <div class="card card-accent" style="display:flex;flex-direction:column;justify-content:center;text-align:center;">
      <div style="position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:var(--sp-sm);">
        <div style="font-size:var(--fs-display);font-weight:var(--fw-display);color:var(--accent);line-height:1;">{{r1Time}}</div>
        <div style="font-size:var(--fs-heading);font-weight:var(--fw-heading);color:var(--text-primary);">{{r1Name}}</div>
        <div style="font-size:var(--fs-body);font-weight:var(--fw-body);color:var(--text-secondary);">{{r1Strategy}}</div>
        <div style="font-size:var(--fs-caption);font-weight:var(--fw-body);color:var(--text-tertiary);">{{r1Target}}</div>
      </div>
    </div>

    <!-- Region 2: SEA -->
    <div class="card" style="display:flex;flex-direction:column;justify-content:center;text-align:center;">
      <div style="position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:var(--sp-sm);">
        <div style="font-size:var(--fs-display);font-weight:var(--fw-display);color:var(--secondary);line-height:1;">{{r2Time}}</div>
        <div style="font-size:var(--fs-heading);font-weight:var(--fw-heading);color:var(--text-primary);">{{r2Name}}</div>
        <div style="font-size:var(--fs-body);font-weight:var(--fw-body);color:var(--text-secondary);">{{r2Strategy}}</div>
        <div style="font-size:var(--fs-caption);font-weight:var(--fw-body);color:var(--text-tertiary);">{{r2Target}}</div>
      </div>
    </div>

    <!-- Region 3: NA -->
    <div class="card" style="display:flex;flex-direction:column;justify-content:center;text-align:center;">
      <div style="position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:var(--sp-sm);">
        <div style="font-size:var(--fs-display);font-weight:var(--fw-display);color:var(--text-primary);line-height:1;">{{r3Time}}</div>
        <div style="font-size:var(--fs-heading);font-weight:var(--fw-heading);color:var(--text-primary);">{{r3Name}}</div>
        <div style="font-size:var(--fs-body);font-weight:var(--fw-body);color:var(--text-secondary);">{{r3Strategy}}</div>
        <div style="font-size:var(--fs-caption);font-weight:var(--fw-body);color:var(--text-tertiary);">{{r3Target}}</div>
      </div>
    </div>

    <!-- Region 4: EU -->
    <div class="card" style="display:flex;flex-direction:column;justify-content:center;text-align:center;">
      <div style="position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:var(--sp-sm);">
        <div style="font-size:var(--fs-display);font-weight:var(--fw-display);color:var(--text-primary);line-height:1;">{{r4Time}}</div>
        <div style="font-size:var(--fs-heading);font-weight:var(--fw-heading);color:var(--text-primary);">{{r4Name}}</div>
        <div style="font-size:var(--fs-body);font-weight:var(--fw-body);color:var(--text-secondary);">{{r4Strategy}}</div>
        <div style="font-size:var(--fs-caption);font-weight:var(--fw-body);color:var(--text-tertiary);">{{r4Target}}</div>
      </div>
    </div>

  </div>
</div>
