<div class="slide">
  <div class="slide-title">{{title}}</div>

  <div class="slide-content sg-cols-3">

    <div class="card" style="display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:var(--sp-md);">
      <div style="position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:var(--sp-sm);">
        <div style="width:160px;height:160px;border-radius:50%;overflow:hidden;background:rgba(255,255,255,0.03);">
          <img src="{{member1Img}}" style="width:100%;height:100%;object-fit:cover;" onerror="this.style.display='none'">
        </div>
        <div style="font-size:var(--fs-heading);font-weight:var(--fw-heading);color:var(--text-primary);margin-top:var(--sp-sm);">{{member1Name}}</div>
        <div style="font-size:var(--fs-caption);font-weight:var(--fw-body);color:var(--text-tertiary);">{{member1Role}}</div>
        <div style="font-size:var(--fs-body);font-weight:var(--fw-body);color:var(--text-secondary);">{{member1Credential}}</div>
      </div>
    </div>

    <div class="card" style="display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:var(--sp-md);">
      <div style="position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:var(--sp-sm);">
        <div style="width:160px;height:160px;border-radius:50%;overflow:hidden;background:rgba(255,255,255,0.03);">
          <img src="{{member2Img}}" style="width:100%;height:100%;object-fit:cover;" onerror="this.style.display='none'">
        </div>
        <div style="font-size:var(--fs-heading);font-weight:var(--fw-heading);color:var(--text-primary);margin-top:var(--sp-sm);">{{member2Name}}</div>
        <div style="font-size:var(--fs-caption);font-weight:var(--fw-body);color:var(--text-tertiary);">{{member2Role}}</div>
        <div style="font-size:var(--fs-body);font-weight:var(--fw-body);color:var(--text-secondary);">{{member2Credential}}</div>
      </div>
    </div>

    <div class="card" style="display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:var(--sp-md);">
      <div style="position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:var(--sp-sm);">
        <div style="width:160px;height:160px;border-radius:50%;overflow:hidden;background:rgba(255,255,255,0.03);">
          <img src="{{member3Img}}" style="width:100%;height:100%;object-fit:cover;" onerror="this.style.display='none'">
        </div>
        <div style="font-size:var(--fs-heading);font-weight:var(--fw-heading);color:var(--text-primary);margin-top:var(--sp-sm);">{{member3Name}}</div>
        <div style="font-size:var(--fs-caption);font-weight:var(--fw-body);color:var(--text-tertiary);">{{member3Role}}</div>
        <div style="font-size:var(--fs-body);font-weight:var(--fw-body);color:var(--text-secondary);">{{member3Credential}}</div>
      </div>
    </div>

  </div>
</div>
