<div class="slide">
  <div class="slide-title">{{title}}</div>

  <div class="slide-content sg-cols-3">

    <!-- Member 1 -->
    <div class="card" style="display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;">
      <div style="position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:var(--sp-sm);">
        <div style="width:160px;height:160px;border-radius:50%;overflow:hidden;background:rgba(255,255,255,0.03);">
          <img src="{{member1Img}}" style="width:100%;height:100%;object-fit:cover;" onerror="this.style.display='none'">
        </div>
        <div style="font-size:var(--fs-heading);font-weight:var(--fw-heading);color:var(--text-primary);margin-top:var(--sp-sm);">{{member1Name}}</div>
        <div style="display:inline-block;font-size:var(--fs-caption);font-weight:var(--fw-body);color:var(--accent);background:var(--accent-light);border-radius:var(--sp-xs);padding:var(--sp-xs) var(--sp-sm);">{{member1Role}}</div>
        <div style="font-size:var(--fs-body);font-weight:var(--fw-body);color:var(--text-secondary);margin-top:var(--sp-xs);">{{member1Cred1}}</div>
        <div style="font-size:var(--fs-body);font-weight:var(--fw-body);color:var(--text-tertiary);">{{member1Cred2}}</div>
      </div>
    </div>

    <!-- Member 2 -->
    <div class="card" style="display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;">
      <div style="position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:var(--sp-sm);">
        <div style="width:160px;height:160px;border-radius:50%;overflow:hidden;background:rgba(255,255,255,0.03);">
          <img src="{{member2Img}}" style="width:100%;height:100%;object-fit:cover;" onerror="this.style.display='none'">
        </div>
        <div style="font-size:var(--fs-heading);font-weight:var(--fw-heading);color:var(--text-primary);margin-top:var(--sp-sm);">{{member2Name}}</div>
        <div style="display:inline-block;font-size:var(--fs-caption);font-weight:var(--fw-body);color:var(--secondary);background:var(--secondary-light);border-radius:var(--sp-xs);padding:var(--sp-xs) var(--sp-sm);">{{member2Role}}</div>
        <div style="font-size:var(--fs-body);font-weight:var(--fw-body);color:var(--text-secondary);margin-top:var(--sp-xs);">{{member2Cred1}}</div>
        <div style="font-size:var(--fs-body);font-weight:var(--fw-body);color:var(--text-tertiary);">{{member2Cred2}}</div>
      </div>
    </div>

    <!-- Member 3 -->
    <div class="card" style="display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;">
      <div style="position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:var(--sp-sm);">
        <div style="width:160px;height:160px;border-radius:50%;overflow:hidden;background:rgba(255,255,255,0.03);">
          <img src="{{member3Img}}" style="width:100%;height:100%;object-fit:cover;" onerror="this.style.display='none'">
        </div>
        <div style="font-size:var(--fs-heading);font-weight:var(--fw-heading);color:var(--text-primary);margin-top:var(--sp-sm);">{{member3Name}}</div>
        <div style="display:inline-block;font-size:var(--fs-caption);font-weight:var(--fw-body);color:var(--secondary);background:var(--secondary-light);border-radius:var(--sp-xs);padding:var(--sp-xs) var(--sp-sm);">{{member3Role}}</div>
        <div style="font-size:var(--fs-body);font-weight:var(--fw-body);color:var(--text-secondary);margin-top:var(--sp-xs);">{{member3Cred1}}</div>
        <div style="font-size:var(--fs-body);font-weight:var(--fw-body);color:var(--text-tertiary);">{{member3Cred2}}</div>
      </div>
    </div>

  </div>
</div>
