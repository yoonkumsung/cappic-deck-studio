<div class="slide">
  <div class="slide-title">{{title}}</div>

  <div class="slide-content sg-cols-2">

    <!-- Left: Big stat + photo -->
    <div style="display:flex;flex-direction:column;gap:var(--sp-md);height:100%;">
      <div style="display:flex;flex-direction:column;gap:var(--sp-xs);">
        <div class="sg-stat-label">{{statLabel}}</div>
        <div class="sg-stat-value" style="color:var(--accent);">{{statValue}}</div>
      </div>
      <div class="sg-photo" style="border-radius:var(--card-radius);overflow:hidden;flex:1;">
        <img src="{{photoSrc}}" style="width:100%;height:100%;object-fit:cover;" onerror="this.style.display='none'">
      </div>
    </div>

    <!-- Right: Pain points card -->
    <div class="card" style="display:flex;flex-direction:column;justify-content:center;">
      <div style="position:relative;z-index:1;">
        <div class="sg-card-title">{{painTitle}}</div>
        <div class="sg-data-list">
          <div class="sg-item">
            <div class="sg-item-label">{{pain1Label}}</div>
            <div class="sg-item-value" style="color:var(--accent);">{{pain1Value}}</div>
          </div>
          <div class="sg-item">
            <div class="sg-item-label">{{pain2Label}}</div>
            <div class="sg-item-value">{{pain2Value}}</div>
          </div>
          <div class="sg-item">
            <div class="sg-item-label">{{pain3Label}}</div>
            <div class="sg-item-value">{{pain3Value}}</div>
          </div>
        </div>
      </div>
    </div>

  </div>

  <div class="slide-source">{{source}}</div>
</div>
