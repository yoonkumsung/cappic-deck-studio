<div class="slide">
  <div class="slide-title">{{title}}</div>

  <div class="slide-content" style="display:flex;align-items:flex-end;justify-content:center;gap:var(--sp-xl);">

    <!-- Staircase: 4 stats rising left to right, Nomot-inspired dramatic numbers -->
    <!-- Stat 1: lowest -->
    <div style="display:flex;flex-direction:column;align-items:center;text-align:center;flex:1;">
      <div class="sg-stat-value" style="color:var(--text-primary);line-height:1;">{{stat1Value}}<span class="sg-stat-unit">{{stat1Unit}}</span></div>
      <div class="sg-stat-label" style="margin-top:var(--sp-sm);">{{stat1Label}}</div>
    </div>

    <!-- Stat 2: rising -->
    <div style="display:flex;flex-direction:column;align-items:center;text-align:center;flex:1;margin-bottom:var(--sp-xl);">
      <div class="sg-stat-value" style="color:var(--secondary);line-height:1;">{{stat2Value}}<span class="sg-stat-unit">{{stat2Unit}}</span></div>
      <div class="sg-stat-label" style="margin-top:var(--sp-sm);">{{stat2Label}}</div>
    </div>

    <!-- Stat 3: higher -->
    <div style="display:flex;flex-direction:column;align-items:center;text-align:center;flex:1;margin-bottom:calc(var(--sp-xl) * 2);">
      <div class="sg-stat-value" style="color:var(--text-primary);line-height:1;">{{stat3Value}}<span class="sg-stat-unit">{{stat3Unit}}</span></div>
      <div class="sg-stat-label" style="margin-top:var(--sp-sm);">{{stat3Label}}</div>
    </div>

    <!-- Stat 4: highest (accent) -->
    <div style="display:flex;flex-direction:column;align-items:center;text-align:center;flex:1;margin-bottom:calc(var(--sp-xl) * 3);">
      <div class="sg-stat-value" style="color:var(--accent);line-height:1;">{{stat4Value}}<span class="sg-stat-unit">{{stat4Unit}}</span></div>
      <div class="sg-stat-label" style="margin-top:var(--sp-sm);">{{stat4Label}}</div>
    </div>

  </div>

  <div class="slide-source">{{source}}</div>
</div>
