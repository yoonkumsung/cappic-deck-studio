<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>S1. 표지</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1024px; height: 768px; }
  body {
    font-family: 'Pretendard Variable', Pretendard, -apple-system, sans-serif;
    background: #2a2a2a;
    overflow: hidden;
  }
  .slide {
    width: 1024px; height: 768px;
    background: #0A0A0A;
    position: relative;
    overflow: hidden;
    color: #fff;
  }
  .bg-glow {
    position: absolute;
    top: -180px; left: -180px;
    width: 500px; height: 500px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(0,199,190,0.15), transparent 70%);
    filter: blur(40px);
  }
  .bg-glow2 {
    position: absolute;
    bottom: -150px; right: -150px;
    width: 400px; height: 400px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(245,158,11,0.06), transparent 70%);
    filter: blur(40px);
  }
  .photo-placeholder {
    position: absolute;
    top: 0; right: 0; width: 45%; height: 100%;
    background: 
      linear-gradient(270deg, #141414 0%, transparent 100%),
      repeating-linear-gradient(45deg, rgba(255,255,255,0.015) 0 12px, transparent 12px 24px);
    border-left: 1px solid rgba(255,255,255,0.05);
  }
  .photo-label {
    position: absolute;
    top: 50%; right: 22%;
    transform: translate(50%, -50%);
    font-size: 11px;
    color: rgba(255,255,255,0.2);
    font-weight: 600;
    letter-spacing: 2px;
    text-align: center;
    line-height: 1.8;
  }
  .photo-label .icon {
    font-size: 32px;
    margin-bottom: 10px;
    color: rgba(255,255,255,0.15);
  }
  .top-label {
    position: absolute;
    top: 65px; left: 65px;
    display: flex; align-items: center; gap: 12px;
    z-index: 2;
  }
  .top-label .dot {
    width: 7px; height: 7px;
    background: #00C7BE;
    border-radius: 50%;
    box-shadow: 0 0 12px rgba(0,199,190,0.6);
  }
  .top-label .text {
    font-size: 11px;
    font-weight: 800;
    color: #00C7BE;
    letter-spacing: 4px;
  }
  .main-title {
    position: absolute;
    top: 165px; left: 65px;
    font-size: 78px;
    font-weight: 900;
    color: #fff;
    letter-spacing: -3px;
    line-height: 0.95;
    z-index: 2;
  }
  .main-title .accent {
    color: #00C7BE;
  }
  .main-title .accent .bang {
    font-style: italic;
  }
  .sub-title {
    position: absolute;
    top: 330px; left: 65px;
    right: 480px;
    font-size: 20px;
    font-weight: 600;
    color: #fff;
    line-height: 1.55;
    letter-spacing: -0.5px;
    z-index: 2;
  }
  .sub-title .quote-mark { color: #00C7BE; font-weight: 800; }
  .sub-title strong { color: #00C7BE; font-weight: 800; }
  .caption {
    position: absolute;
    top: 460px; left: 65px;
    font-size: 15px;
    font-weight: 500;
    color: rgba(255,255,255,0.5);
    letter-spacing: -0.2px;
    z-index: 2;
  }
  .divider {
    position: absolute;
    bottom: 135px; left: 65px;
    width: 60px; height: 3px;
    background: #00C7BE;
    border-radius: 2px;
    z-index: 2;
  }
  .personalize {
    position: absolute;
    bottom: 55px; left: 65px;
    z-index: 2;
  }
  .personalize .for {
    font-size: 10px;
    font-weight: 800;
    color: #00C7BE;
    letter-spacing: 3px;
    margin-bottom: 6px;
  }
  .personalize .name {
    font-size: 22px;
    font-weight: 800;
    color: #fff;
    letter-spacing: -0.5px;
    margin-bottom: 3px;
  }
  .personalize .date {
    font-size: 11px;
    font-weight: 500;
    color: rgba(255,255,255,0.4);
    letter-spacing: 0.5px;
  }
  .right-bottom {
    position: absolute;
    bottom: 55px; right: 65px;
    text-align: right;
    z-index: 2;
  }
  .brand {
    font-size: 28px;
    font-weight: 900;
    color: #fff;
    letter-spacing: -1px;
    margin-bottom: 4px;
  }
  .brand .accent { color: #00C7BE; }
  .presenter {
    font-size: 11px;
    font-weight: 600;
    color: rgba(255,255,255,0.5);
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>
<div class="slide">
  <div class="bg-glow"></div>
  <div class="bg-glow2"></div>
  <div class="photo-placeholder"></div>
  <div class="photo-label">
    <div class="icon">⚽</div>
    학생 환호 컷<br>(초상권 동의 분만)
  </div>
  <div class="top-label">
    <span class="dot"></span>
    <span class="text">CAPP!C × 축구교실 대표님</span>
  </div>
  <div class="main-title">
    It's Your<br>
    <span class="accent">Highlights<span class="bang">!</span></span>
  </div>
  <div class="sub-title">
    연출된 '여기 봐봐' 대신,<br>
    <strong>행복한 진짜 순간</strong>을 학부모에게
  </div>
  <div class="caption">성장하는 축구교실의 비법.</div>
  <div class="divider"></div>
</div>
</body>
</html>
