<div class="slide">

  <!-- Full-screen background photo placeholder (dimmed) -->
  <div style="position:absolute;inset:0;background:rgba(0,0,0,0.7);z-index:0;">
    <img src="{{bgPhoto}}" style="width:100%;height:100%;object-fit:cover;opacity:0.3;" onerror="this.style.display='none'">
  </div>

  <!-- Left hints -->
  <div style="position:absolute;top:50%;left:var(--slide-pad-side);transform:translateY(-50%);z-index:1;">
    <div style="font-size:var(--fs-body);font-weight:var(--fw-body);color:var(--text-tertiary);line-height:2;">{{hintLeft1}}</div>
    <div style="font-size:var(--fs-body);font-weight:var(--fw-body);color:var(--text-tertiary);line-height:2;">{{hintLeft2}}</div>
  </div>

  <!-- Right hints -->
  <div style="position:absolute;top:50%;right:var(--slide-pad-side);transform:translateY(-50%);text-align:right;z-index:1;">
    <div style="font-size:var(--fs-body);font-weight:var(--fw-body);color:var(--text-tertiary);line-height:2;">{{hintRight1}}</div>
    <div style="font-size:var(--fs-body);font-weight:var(--fw-body);color:var(--text-tertiary);line-height:2;">{{hintRight2}}</div>
  </div>

  <!-- Center quote -->
  <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:2;text-align:center;max-width:900px;">
    <div style="font-size:var(--fs-display);font-weight:var(--fw-display);color:var(--text-primary);line-height:1.4;">{{quote}}</div>
  </div>

</div>
