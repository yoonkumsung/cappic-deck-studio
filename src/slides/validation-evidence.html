<div class="slide">
  <div class="slide-title">{{title}}</div>

  <div class="slide-content sg-cols-2">

    <!-- Left: LOI/MOU -->
    <div class="card" style="display:flex;flex-direction:column;">
      <div style="position:relative;z-index:1;flex:1;display:flex;flex-direction:column;">
        <div class="sg-card-title">{{partnerTitle}}</div>
        <div class="sg-data-list">
          <div class="sg-item">
            <div class="sg-item-label">{{loiLabel}}</div>
            <div class="sg-item-value" style="color:var(--accent);">{{loiValue}}</div>
          </div>
          <div class="sg-item">
            <div class="sg-item-label">{{mouLabel}}</div>
            <div class="sg-item-value">{{mouValue}}</div>
          </div>
          <div class="sg-item">
            <div class="sg-item-label">{{mouDetailLabel}}</div>
            <div class="sg-item-value">{{mouDetailValue}}</div>
          </div>
        </div>
        <div class="sg-photo" style="border-radius:var(--card-radius);overflow:hidden;margin-top:var(--sp-md);flex:1;">
          <img src="{{partnerPhoto}}" style="width:100%;height:100%;object-fit:cover;" onerror="this.style.display='none'">
        </div>
      </div>
    </div>

    <!-- Right: Patent/Awards -->
    <div class="card card-accent" style="display:flex;flex-direction:column;">
      <div style="position:relative;z-index:1;flex:1;display:flex;flex-direction:column;">
        <div class="sg-card-title">{{ipTitle}}</div>
        <div class="sg-data-list">
          <div class="sg-item">
            <div class="sg-item-label">{{patentLabel}}</div>
            <div class="sg-item-value">{{patentValue}}</div>
          </div>
          <div class="sg-item">
            <div class="sg-item-label">{{awardsLabel}}</div>
            <div class="sg-item-value">{{awardsValue}}</div>
          </div>
          <div class="sg-item">
            <div class="sg-item-label">{{awardsDetailLabel}}</div>
            <div class="sg-item-value">{{awardsDetailValue}}</div>
          </div>
        </div>
        <div class="sg-photo" style="border-radius:var(--card-radius);overflow:hidden;margin-top:var(--sp-md);flex:1;">
          <img src="{{awardsPhoto}}" style="width:100%;height:100%;object-fit:cover;" onerror="this.style.display='none'">
        </div>
      </div>
    </div>

  </div>
</div>
