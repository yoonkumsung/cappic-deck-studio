<div class="slide">
  <div class="slide-title">{{title}}</div>

  <div class="slide-content sg-cols-2">

    <!-- Left: Big Ask Amount -->
    <div class="card card-accent" style="display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;">
      <div style="position:relative;z-index:1;">
        <div class="sg-stat-value" style="line-height:1;">{{askAmount}}<span class="sg-stat-unit">{{askUnit}}</span></div>
        <div class="sg-stat-label" style="margin-top:var(--sp-sm);">{{askLabel}}</div>
        <div style="font-size:var(--fs-caption);font-weight:var(--fw-body);color:var(--text-tertiary);margin-top:var(--sp-md);">{{askTarget}}</div>
      </div>
    </div>

    <!-- Right: Fund Usage with horizontal bars -->
    <div class="card" style="display:flex;flex-direction:column;">
      <div style="position:relative;z-index:1;flex:1;display:flex;flex-direction:column;">
        <div class="sg-card-title">{{usageTitle}}</div>
        <div class="sg-data-list">
          <!-- Usage 1 -->
          <div class="sg-item">
            <div style="display:flex;justify-content:space-between;align-items:center;">
              <div class="sg-item-label">{{use1Name}}</div>
              <div class="sg-item-value">{{use1Pct}}</div>
            </div>
            <div style="width:100%;height:var(--sp-xs);background:rgba(255,255,255,0.06);border-radius:var(--sp-xs);overflow:hidden;margin-top:var(--sp-xs);">
              <div style="width:{{use1Pct}};height:100%;background:var(--accent);border-radius:var(--sp-xs);"></div>
            </div>
          </div>
          <!-- Usage 2 -->
          <div class="sg-item">
            <div style="display:flex;justify-content:space-between;align-items:center;">
              <div class="sg-item-label">{{use2Name}}</div>
              <div class="sg-item-value">{{use2Pct}}</div>
            </div>
            <div style="width:100%;height:var(--sp-xs);background:rgba(255,255,255,0.06);border-radius:var(--sp-xs);overflow:hidden;margin-top:var(--sp-xs);">
              <div style="width:{{use2Pct}};height:100%;background:var(--secondary);border-radius:var(--sp-xs);"></div>
            </div>
          </div>
          <!-- Usage 3 -->
          <div class="sg-item">
            <div style="display:flex;justify-content:space-between;align-items:center;">
              <div class="sg-item-label">{{use3Name}}</div>
              <div class="sg-item-value">{{use3Pct}}</div>
            </div>
            <div style="width:100%;height:var(--sp-xs);background:rgba(255,255,255,0.06);border-radius:var(--sp-xs);overflow:hidden;margin-top:var(--sp-xs);">
              <div style="width:{{use3Pct}};height:100%;background:var(--text-tertiary);border-radius:var(--sp-xs);"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>
