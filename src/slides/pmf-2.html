<div class="slide">
  <div class="slide-title">{{title}}</div>

  <div class="slide-content" style="display:flex;padding-left:3%;">
    <div style="width:60%;display:grid;grid-template-rows:repeat(7, 1fr);height:100%;">
      <div style="display:flex;align-items:center;gap:var(--sp-sm);opacity:0.7;">
        <div style="width:40px;height:40px;border-radius:50%;border:2px solid var(--secondary);background:var(--secondary-05);display:flex;align-items:center;justify-content:center;font-size:var(--fs-heading);font-weight:var(--fw-heading);color:var(--secondary);flex-shrink:0;">1</div>
        <div><span style="font-size:var(--fs-stat);font-weight:var(--fw-heading);color:var(--secondary);">시장 기회</span><span style="margin-left:var(--sp-sm);font-size:var(--fs-heading);color:var(--secondary);">글로벌 스포츠 촬영·분석 시장 88조원, 연 20% 성장</span></div>
      </div>
      <div style="display:flex;align-items:center;gap:var(--sp-sm);">
        <div style="width:40px;height:40px;border-radius:50%;border:2px solid var(--secondary);background:var(--secondary-15);display:flex;align-items:center;justify-content:center;font-size:var(--fs-heading);font-weight:var(--fw-heading);color:var(--secondary);flex-shrink:0;">2</div>
        <div><span style="font-size:var(--fs-stat);font-weight:var(--fw-heading);color:var(--secondary);">현장 수요</span><span style="margin-left:var(--sp-sm);font-size:var(--fs-heading);color:var(--text-secondary);">촬영 수요 97% / 촬영 서비스 경험 22%</span></div>
      </div>
      <div style="display:flex;align-items:center;gap:var(--sp-sm);opacity:0.35;">
        <div style="width:40px;height:40px;border-radius:50%;border:2px solid var(--text-tertiary);display:flex;align-items:center;justify-content:center;font-size:var(--fs-heading);font-weight:var(--fw-heading);color:var(--text-tertiary);flex-shrink:0;">3</div>
        <div><span style="font-size:var(--fs-stat);font-weight:var(--fw-heading);color:var(--text-tertiary);">수요 검증</span><span style="margin-left:var(--sp-sm);font-size:var(--fs-heading);color:var(--text-tertiary);">이용 의향 91% / 월 1만원 이상 지불 의사 64%</span></div>
      </div>
      <div style="display:flex;align-items:center;gap:var(--sp-sm);opacity:0.35;">
        <div style="width:40px;height:40px;border-radius:50%;border:2px solid var(--text-tertiary);display:flex;align-items:center;justify-content:center;font-size:var(--fs-heading);font-weight:var(--fw-heading);color:var(--text-tertiary);flex-shrink:0;">4</div>
        <div><span style="font-size:var(--fs-stat);font-weight:var(--fw-heading);color:var(--text-tertiary);">솔루션 검증</span><span style="margin-left:var(--sp-sm);font-size:var(--fs-heading);color:var(--text-tertiary);">스마트폰 · 미러리스 · 액션캠 · MVP 동시 비교 테스트</span></div>
      </div>
      <div style="display:flex;align-items:center;gap:var(--sp-sm);opacity:0.35;">
        <div style="width:40px;height:40px;border-radius:50%;border:2px solid var(--text-tertiary);display:flex;align-items:center;justify-content:center;font-size:var(--fs-heading);font-weight:var(--fw-heading);color:var(--text-tertiary);flex-shrink:0;">5</div>
        <div><span style="font-size:var(--fs-stat);font-weight:var(--fw-heading);color:var(--text-tertiary);">실사용 검증</span><span style="margin-left:var(--sp-sm);font-size:var(--fs-heading);color:var(--text-tertiary);">테스터의 80%가 SNS에 자발적으로 공유</span></div>
      </div>
      <div style="display:flex;align-items:center;gap:var(--sp-sm);opacity:0.35;">
        <div style="width:40px;height:40px;border-radius:50%;border:2px solid var(--text-tertiary);display:flex;align-items:center;justify-content:center;font-size:var(--fs-heading);font-weight:var(--fw-heading);color:var(--text-tertiary);flex-shrink:0;">6</div>
        <div><span style="font-size:var(--fs-stat);font-weight:var(--fw-heading);color:var(--text-tertiary);">구매 의사</span><span style="margin-left:var(--sp-sm);font-size:var(--fs-heading);color:var(--text-tertiary);">시제품 출시 전 B2B LOI 10개소 / 총 신청 50건+</span></div>
      </div>
      <div style="display:flex;align-items:center;gap:var(--sp-sm);opacity:0.35;">
        <div style="width:40px;height:40px;border-radius:50%;border:2px solid var(--text-tertiary);display:flex;align-items:center;justify-content:center;font-size:var(--fs-heading);font-weight:var(--fw-heading);color:var(--text-tertiary);flex-shrink:0;">7</div>
        <div><span style="font-size:var(--fs-stat);font-weight:var(--fw-heading);color:var(--text-tertiary);">실행 역량</span><span style="margin-left:var(--sp-sm);font-size:var(--fs-heading);color:var(--text-tertiary);">가설 - 테스트 - 피드백을 통한 10회 이상의 Pivoting</span></div>
      </div>
    </div>
  </div>
</div>
