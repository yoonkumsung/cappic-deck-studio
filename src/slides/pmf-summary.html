<div class="slide">
  <div class="slide-title">{{title}}</div>

  <div class="slide-content" style="display:grid;grid-template-rows:repeat(7,1fr);height:100%;gap:0;">

    <!-- Step 1 -->
    <div style="display:flex;align-items:center;padding:0 var(--sp-xs);border-bottom:1px solid;">
      <div style="width:52px;height:52px;border-radius:50%;border:2px solid var(--secondary);display:flex;align-items:center;justify-content:center;font-size:var(--fs-heading);font-weight:var(--fw-display);color:var(--secondary);flex-shrink:0;margin-right:var(--sp-sm);">1</div>
      <div style="font-size:var(--fs-heading);font-weight:var(--fw-display);color:var(--text-primary);width:160px;text-align:right;flex-shrink:0;">{{s1Name}}</div>
      <div style="flex:1;font-size:var(--fs-heading);color:var(--text-secondary);text-align:center;padding:0 var(--sp-xs);">{{s1Desc}}</div>
      <div class="pmf-tag" style="font-size:var(--fs-heading);font-weight:var(--fw-heading);width:160px;text-align:left;flex-shrink:0;">{{s1Tag}}</div>
    </div>

    <!-- Step 2 -->
    <div style="display:flex;align-items:center;padding:0 var(--sp-xs);border-bottom:1px solid;">
      <div style="width:52px;height:52px;border-radius:50%;border:2px solid var(--secondary);display:flex;align-items:center;justify-content:center;font-size:var(--fs-heading);font-weight:var(--fw-display);color:var(--secondary);flex-shrink:0;margin-right:var(--sp-sm);">2</div>
      <div style="font-size:var(--fs-heading);font-weight:var(--fw-display);color:var(--text-primary);width:160px;text-align:right;flex-shrink:0;">{{s2Name}}</div>

      <div class="pmf-tag" style="font-size:var(--fs-heading);font-weight:var(--fw-heading);width:160px;text-align:left;flex-shrink:0;">{{s2Tag}}</div>
    </div>

    <!-- Step 3 -->

      <div style="width:52px;height:52px;border-radius:50%;border:2px solid var(--secondary);display:flex;align-items:center;justify-content:center;font-size:var(--fs-heading);font-weight:var(--fw-display);color:var(--secondary);flex-shrink:0;margin-right:var(--sp-sm);">3</div>

    <!-- Step 4 -->
