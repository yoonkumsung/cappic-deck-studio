<div class="slide" style="position:relative;">

  <!-- Title (top-left fixed) -->
  <div style="position:absolute;top:80px;left:120px;">
    <div style="font-size:48px;font-weight:800;color:#fff;line-height:1.3;">{{title}}</div>
  </div>

  <div style="position:absolute;top:220px;left:120px;right:120px;bottom:80px;">

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:24px;height:100%;">

      <!-- Left: Photo area -->
      <div style="border-radius:16px;background:rgba(255,255,255,0.03);overflow:hidden;display:flex;align-items:center;justify-content:center;">
        <img src="{{photoSrc}}" style="width:100%;height:100%;object-fit:cover;" onerror="this.parentElement.innerHTML='<span style=color:rgba(255,255,255,0.1);font-size:15px;>이미지 영역</span>'">
      </div>

      <!-- Right: Data -->
      <div style="display:flex;flex-direction:column;gap:20px;">

        <!-- Stat row 1: 장비 + 촬영 비용 -->
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
          <div style="background:rgba(255,255,255,0.03);border-radius:16px;padding:28px;">
            <div style="font-size:56px;font-weight:800;color:#fff;line-height:1;">
              {{stat1Value}}<span style="font-size:24px;font-weight:600;opacity:0.5;margin-left:2px;">{{stat1Unit}}</span>
            </div>
            <div style="font-size:20px;font-weight:600;color:var(--text-secondary);margin-top:8px;">{{stat1Label}}</div>
          </div>
          <div style="background:rgba(255,255,255,0.03);border-radius:16px;padding:28px;">
            <div style="font-size:56px;font-weight:800;color:#fff;line-height:1;">
              {{stat2Value}}<span style="font-size:24px;font-weight:600;opacity:0.5;margin-left:2px;">{{stat2Unit}}</span>
            </div>
            <div style="font-size:20px;font-weight:600;color:var(--text-secondary);margin-top:8px;">{{stat2Label}}</div>
          </div>
        </div>

        <!-- Gap highlight -->
        <div style="background:rgba(247,225,80,0.06);border-radius:16px;padding:32px;flex:1;display:flex;align-items:center;gap:36px;">

          <div style="display:flex;align-items:center;gap:24px;">
            <div style="text-align:center;">
              <div style="font-size:48px;font-weight:800;color:#fff;line-height:1;">{{stat3Value}}<span style="font-size:22px;opacity:0.5;">{{stat3Unit}}</span></div>
              <div style="font-size:18px;color:var(--text-secondary);margin-top:6px;">{{stat3Label}}</div>
            </div>

            <div style="font-size:28px;color:rgba(255,255,255,0.15);">vs</div>

            <div style="text-align:center;">
              <div style="font-size:48px;font-weight:800;color:#fff;line-height:1;">{{stat4Value}}<span style="font-size:22px;opacity:0.5;">{{stat4Unit}}</span></div>
              <div style="font-size:18px;color:var(--text-secondary);margin-top:6px;">{{stat4Label}}</div>
            </div>
          </div>

          <div style="font-size:32px;color:rgba(255,255,255,0.15);">→</div>

          <div style="text-align:center;">
            <div style="font-size:56px;font-weight:800;color:var(--accent);line-height:1;">{{gapValue}}</div>
            <div style="font-size:18px;color:var(--accent-dark);margin-top:6px;">{{gapLabel}}</div>
          </div>

        </div>

      </div>

    </div>

  </div>

  <!-- Source -->
  <div style="position:absolute;bottom:40px;left:120px;font-size:15px;color:var(--text-source);">
    Source: {{source}}
  </div>

</div>
