<div class="slide">
  <div class="slide-title">{{title}}</div>

  <div class="slide-content sg-cols-2">

    <!-- Left: Photo -->
    <div class="sg-photo-placeholder">
      <img src="{{photoSrc}}" onerror="this.style.display='none'">
    </div>

    <!-- Right: Data -->
    <div class="sg-rows-2">

      <!-- Top: 2 stat cards -->
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--slide-gap);">
        <div class="card" style="display:flex;align-items:flex-end;">
          <div style="position:relative;z-index:1;">
            <div class="sg-stat-value">{{stat1Value}}<span class="sg-stat-unit">{{stat1Unit}}</span></div>
            <div class="sg-stat-label">{{stat1Label}}</div>
          </div>
        </div>
        <div class="card" style="display:flex;align-items:flex-end;">
          <div style="position:relative;z-index:1;">
            <div class="sg-stat-value">{{stat2Value}}<span class="sg-stat-unit">{{stat2Unit}}</span></div>
            <div class="sg-stat-label">{{stat2Label}}</div>
          </div>
        </div>
      </div>

      <!-- Bottom: Gap highlight -->
      <div class="card card-accent" style="display:flex;align-items:center;">
        <div style="position:relative;z-index:1;display:flex;align-items:center;gap:var(--sp-xl);width:100%;">
          <div style="text-align:center;">
            <div class="sg-stat-value">{{stat3Value}}<span class="sg-stat-unit">{{stat3Unit}}</span></div>
            <div class="sg-stat-label">{{stat3Label}}</div>
          </div>
          <div style="font-size:var(--fs-heading);color:var(--text-secondary);">vs</div>
          <div style="text-align:center;">
            <div class="sg-stat-value">{{stat4Value}}<span class="sg-stat-unit">{{stat4Unit}}</span></div>
            <div class="sg-stat-label">{{stat4Label}}</div>
          </div>
          <div style="font-size:var(--fs-heading);color:var(--text-secondary);">→</div>
          <div style="text-align:center;">
            <div class="sg-stat-value" style="color:var(--accent);">{{gapValue}}</div>
            <div class="sg-stat-label">{{gapLabel}}</div>
          </div>
        </div>
      </div>

    </div>

  </div>

  <div class="slide-source">Source: {{source}}</div>
</div>
