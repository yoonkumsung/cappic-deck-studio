<div class="slide" style="position:relative;">

  <!-- Title (top-left fixed) -->
  <div style="position:absolute;top:80px;left:120px;">
    <div style="font-size:48px;font-weight:800;color:#fff;line-height:1.3;">{{title}}</div>
  </div>

  <div style="position:absolute;top:220px;left:120px;right:120px;bottom:80px;display:grid;grid-template-columns:1fr 1fr;gap:24px;">

    <!-- Left: Photo area (full height) -->
    <div style="border-radius:18px;overflow:hidden;background:rgba(255,255,255,0.03);">
      <img src="{{photoSrc}}" style="width:100%;height:100%;object-fit:cover;" onerror="this.style.display='none'">
    </div>

    <!-- Right: Data -->
    <div style="display:grid;grid-template-rows:1fr 1fr;gap:20px;">

      <!-- Stat row: 장비 + 촬영 비용 -->
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;">
        <div class="card" style="display:flex;align-items:flex-end;">
          <div style="position:relative;z-index:1;">
            <div style="font-size:56px;font-weight:800;color:#fff;line-height:1;">
              {{stat1Value}}<span style="font-size:24px;font-weight:600;opacity:0.6;margin-left:2px;">{{stat1Unit}}</span>
            </div>
            <div style="font-size:20px;font-weight:600;color:var(--text-secondary);margin-top:8px;">{{stat1Label}}</div>
          </div>
        </div>
        <div class="card" style="display:flex;align-items:flex-end;">
          <div style="position:relative;z-index:1;">
            <div style="font-size:56px;font-weight:800;color:#fff;line-height:1;">
              {{stat2Value}}<span style="font-size:24px;font-weight:600;opacity:0.6;margin-left:2px;">{{stat2Unit}}</span>
            </div>
            <div style="font-size:20px;font-weight:600;color:var(--text-secondary);margin-top:8px;">{{stat2Label}}</div>
          </div>
        </div>
      </div>

      <!-- Gap highlight -->
      <div class="card card-accent" style="display:flex;align-items:center;">
        <div style="position:relative;z-index:1;display:flex;align-items:center;gap:36px;width:100%;">
          <div style="text-align:center;">
            <div style="font-size:48px;font-weight:800;color:#fff;line-height:1;">{{stat3Value}}<span style="font-size:22px;opacity:0.6;">{{stat3Unit}}</span></div>
            <div style="font-size:18px;color:var(--text-secondary);margin-top:6px;">{{stat3Label}}</div>
          </div>
          <div style="font-size:28px;color:var(--text-secondary);">vs</div>
          <div style="text-align:center;">
            <div style="font-size:48px;font-weight:800;color:#fff;line-height:1;">{{stat4Value}}<span style="font-size:22px;opacity:0.6;">{{stat4Unit}}</span></div>
            <div style="font-size:18px;color:var(--text-secondary);margin-top:6px;">{{stat4Label}}</div>
          </div>
          <div style="font-size:32px;color:var(--text-secondary);">→</div>
          <div style="text-align:center;">
            <div style="font-size:56px;font-weight:800;color:var(--accent);line-height:1;">{{gapValue}}</div>
            <div style="font-size:18px;font-weight:600;color:var(--text-secondary);margin-top:6px;">{{gapLabel}}</div>
          </div>
        </div>
      </div>

    </div>

  </div>

  <!-- Source -->
  <div style="position:absolute;bottom:40px;left:120px;font-size:15px;color:#888888;">
    Source: {{source}}
  </div>

</div>
