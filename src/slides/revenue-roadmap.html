<div class="slide">
  <div class="slide-title">{{title}}</div>

  <div class="slide-content" style="display:flex;flex-direction:column;justify-content:center;gap:var(--sp-lg);">

    <!-- Bar chart area -->
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:var(--sp-xl);align-items:flex-end;flex:1;padding-bottom:var(--sp-md);">

      <!-- 2026 -->
      <div style="display:flex;flex-direction:column;align-items:center;gap:var(--sp-sm);">
        <div style="font-size:var(--fs-stat);font-weight:var(--fw-display);color:var(--secondary);">{{y1Value}}</div>
        <div style="width:100%;height:60px;border-radius:8px 8px 0 0;background:linear-gradient(180deg,var(--secondary),var(--secondary-20));"></div>
        <div style="font-size:var(--fs-heading);font-weight:var(--fw-display);color:var(--text-primary);">{{y1Year}}</div>
        <div style="text-align:center;">
          <div style="font-size:var(--fs-caption);color:var(--text-secondary);">{{y1Driver1}}</div>
          <div style="font-size:var(--fs-caption);color:var(--text-tertiary);">{{y1Driver2}}</div>
          <div style="font-size:var(--fs-caption);color:var(--text-tertiary);">{{y1Driver3}}</div>
        </div>
      </div>

      <!-- 2027 -->
      <div style="display:flex;flex-direction:column;align-items:center;gap:var(--sp-sm);">
        <div style="font-size:var(--fs-stat);font-weight:var(--fw-display);color:var(--text-primary);">{{y2Value}}</div>
        <div style="width:100%;height:200px;border-radius:8px 8px 0 0;background:linear-gradient(180deg,var(--secondary-50),var(--secondary-10));"></div>
        <div style="font-size:var(--fs-heading);font-weight:var(--fw-display);color:var(--text-primary);">{{y2Year}}</div>
        <div style="text-align:center;">
          <div style="font-size:var(--fs-caption);color:var(--text-secondary);">{{y2Driver1}}</div>
          <div style="font-size:var(--fs-caption);color:var(--text-tertiary);">{{y2Driver2}}</div>
          <div style="font-size:var(--fs-caption);color:var(--text-tertiary);">{{y2Driver3}}</div>
        </div>
      </div>

      <!-- 2028 -->
      <div style="display:flex;flex-direction:column;align-items:center;gap:var(--sp-sm);">
        <div style="font-size:var(--fs-stat);font-weight:var(--fw-display);color:var(--text-primary);">{{y3Value}}</div>
        <div style="width:100%;height:420px;border-radius:8px 8px 0 0;background:linear-gradient(180deg,var(--secondary-70),var(--secondary-15));"></div>
        <div style="font-size:var(--fs-heading);font-weight:var(--fw-display);color:var(--text-primary);">{{y3Year}}</div>
        <div style="text-align:center;">
          <div style="font-size:var(--fs-caption);color:var(--text-secondary);">{{y3Driver1}}</div>
          <div style="font-size:var(--fs-caption);color:var(--text-tertiary);">{{y3Driver2}}</div>
          <div style="font-size:var(--fs-caption);color:var(--text-tertiary);">{{y3Driver3}}</div>
        </div>
      </div>

    </div>

  </div>
</div>
