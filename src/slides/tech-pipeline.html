<div class="slide">
  <div class="slide-title">{{title}}</div>

  <div class="slide-content" style="display:flex;align-items:center;justify-content:center;">

    <div style="display:flex;align-items:center;gap:0;width:100%;">

      <!-- Stage 1 -->
      <div class="card" style="flex:1;text-align:center;display:flex;flex-direction:column;align-items:center;gap:var(--sp-sm);">
        <div style="position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:var(--sp-sm);">
          <div style="width:64px;height:64px;border-radius:50%;background:var(--accent-light);border:2px solid var(--accent);display:flex;align-items:center;justify-content:center;">
            <div style="font-size:var(--fs-heading);font-weight:var(--fw-heading);color:var(--accent);">1</div>
          </div>
          <div style="font-size:var(--fs-heading);font-weight:var(--fw-heading);color:var(--accent);">{{stage1Name}}</div>
          <div style="font-size:var(--fs-caption);font-weight:var(--fw-body);color:var(--text-tertiary);">{{stage1Sub}}</div>
          <div style="font-size:var(--fs-caption);font-weight:var(--fw-body);color:var(--text-secondary);">{{stage1Desc}}</div>
        </div>
      </div>

      <!-- Arrow -->
      <div style="color:var(--text-tertiary);font-size:var(--fs-heading);font-weight:var(--fw-heading);">→</div>

      <!-- Stage 2 -->
      <div class="card" style="flex:1;text-align:center;display:flex;flex-direction:column;align-items:center;gap:var(--sp-sm);">
        <div style="position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:var(--sp-sm);">
          <div style="width:64px;height:64px;border-radius:50%;background:var(--secondary-light);border:2px solid var(--secondary);display:flex;align-items:center;justify-content:center;">
            <div style="font-size:var(--fs-heading);font-weight:var(--fw-heading);color:var(--secondary);">2</div>
          </div>
          <div style="font-size:var(--fs-heading);font-weight:var(--fw-heading);color:var(--secondary);">{{stage2Name}}</div>
          <div style="font-size:var(--fs-caption);font-weight:var(--fw-body);color:var(--text-tertiary);">{{stage2Sub}}</div>
          <div style="font-size:var(--fs-caption);font-weight:var(--fw-body);color:var(--text-secondary);">{{stage2Desc}}</div>
        </div>
      </div>

      <!-- Arrow -->
      <div style="color:var(--text-tertiary);font-size:var(--fs-heading);font-weight:var(--fw-heading);">→</div>

      <!-- Stage 3 -->
      <div class="card" style="flex:1;text-align:center;display:flex;flex-direction:column;align-items:center;gap:var(--sp-sm);">
        <div style="position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:var(--sp-sm);">
          <div style="width:64px;height:64px;border-radius:50%;background:var(--secondary-light);border:2px solid var(--secondary);display:flex;align-items:center;justify-content:center;">
            <div style="font-size:var(--fs-heading);font-weight:var(--fw-heading);color:var(--secondary);">3</div>
          </div>
          <div style="font-size:var(--fs-heading);font-weight:var(--fw-heading);color:var(--text-primary);">{{stage3Name}}</div>
          <div style="font-size:var(--fs-caption);font-weight:var(--fw-body);color:var(--text-tertiary);">{{stage3Sub}}</div>
          <div style="font-size:var(--fs-caption);font-weight:var(--fw-body);color:var(--text-secondary);">{{stage3Desc}}</div>
        </div>
      </div>

      <!-- Arrow -->
      <div style="color:var(--text-tertiary);font-size:var(--fs-heading);font-weight:var(--fw-heading);">→</div>

      <!-- Stage 4 -->
      <div class="card" style="flex:1;text-align:center;display:flex;flex-direction:column;align-items:center;gap:var(--sp-sm);">
        <div style="position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:var(--sp-sm);">
          <div style="width:64px;height:64px;border-radius:50%;background:var(--secondary-light);border:2px solid var(--secondary);display:flex;align-items:center;justify-content:center;">
            <div style="font-size:var(--fs-heading);font-weight:var(--fw-heading);color:var(--secondary);">4</div>
          </div>
          <div style="font-size:var(--fs-heading);font-weight:var(--fw-heading);color:var(--text-primary);">{{stage4Name}}</div>
          <div style="font-size:var(--fs-caption);font-weight:var(--fw-body);color:var(--text-tertiary);">{{stage4Sub}}</div>
          <div style="font-size:var(--fs-caption);font-weight:var(--fw-body);color:var(--text-secondary);">{{stage4Desc}}</div>
        </div>
      </div>

      <!-- Arrow -->
      <div style="color:var(--text-tertiary);font-size:var(--fs-heading);font-weight:var(--fw-heading);">→</div>

      <!-- Stage 5 -->
      <div class="card card-accent" style="flex:1;text-align:center;display:flex;flex-direction:column;align-items:center;gap:var(--sp-sm);">
        <div style="position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:var(--sp-sm);">
          <div style="width:64px;height:64px;border-radius:50%;background:rgba(247,225,80,0.2);border:2px solid var(--accent);display:flex;align-items:center;justify-content:center;">
            <div style="font-size:var(--fs-heading);font-weight:var(--fw-heading);color:var(--accent);">5</div>
          </div>
          <div style="font-size:var(--fs-heading);font-weight:var(--fw-heading);color:var(--accent);">{{stage5Name}}</div>
          <div style="font-size:var(--fs-caption);font-weight:var(--fw-body);color:var(--text-tertiary);">{{stage5Sub}}</div>
          <div style="font-size:var(--fs-caption);font-weight:var(--fw-body);color:var(--text-secondary);">{{stage5Desc}}</div>
        </div>
      </div>

    </div>

  </div>
</div>
