<div class="slide">
  <div class="slide-title">{{title}}</div>

  <div class="slide-content sg-cols-2">

    <!-- Left: Cloud problems -->
    <div class="card" style="display:flex;flex-direction:column;justify-content:center;">
      <div style="position:relative;z-index:1;">
        <div class="sg-card-title" style="color:var(--text-tertiary);">{{cloudTitle}}</div>
        <div class="sg-data-list">
          <div class="sg-item">
            <div class="sg-item-label">{{cloud1Label}}</div>
            <div class="sg-item-value">{{cloud1Value}}</div>
          </div>
          <div class="sg-item">
            <div class="sg-item-label">{{cloud2Label}}</div>
            <div class="sg-item-value">{{cloud2Value}}</div>
          </div>
          <div class="sg-item">
            <div class="sg-item-label">{{cloud3Label}}</div>
            <div class="sg-item-value">{{cloud3Value}}</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Right: Edge AI solution -->
    <div class="card card-accent" style="display:flex;flex-direction:column;justify-content:center;">
      <div style="position:relative;z-index:1;">
        <div class="sg-card-title">{{edgeTitle}}</div>
        <div class="sg-data-list">
          <div class="sg-item">
            <div class="sg-item-label">{{edge1Label}}</div>
            <div class="sg-item-value">{{edge1Value}}</div>
          </div>
          <div class="sg-item">
            <div class="sg-item-label">{{edge2Label}}</div>
            <div class="sg-item-value">{{edge2Value}}</div>
          </div>
          <div class="sg-item">
            <div class="sg-item-label">{{edge3Label}}</div>
            <div class="sg-item-value">{{edge3Value}}</div>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>
