<div class="slide" style="display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;">

  <!-- Vignette overlay (light mode only, hidden by default) -->
  <div class="cover-vignette" style="position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 80% 80% at center,transparent 50%,rgba(0,0,0,0.15) 100%);z-index:2;display:none;"></div>

  <!-- Viewfinder Grid (subtle) -->
  <div style="position:absolute;inset:0;pointer-events:none;">
    <div style="position:absolute;left:33.33%;top:80px;bottom:80px;width:1px;background:var(--text-tertiary);opacity:0.12;"></div>
    <div style="position:absolute;left:66.66%;top:80px;bottom:80px;width:1px;background:var(--text-tertiary);opacity:0.12;"></div>
    <div style="position:absolute;top:33.33%;left:80px;right:80px;height:1px;background:var(--text-tertiary);opacity:0.12;"></div>
    <div style="position:absolute;top:66.66%;left:80px;right:80px;height:1px;background:var(--text-tertiary);opacity:0.12;"></div>
  </div>

  <!-- Corner Brackets -->
  <div style="position:absolute;top:48px;left:56px;">
    <div style="width:48px;height:48px;border-top:2.5px solid var(--text-tertiary);border-left:2.5px solid var(--text-tertiary);opacity:0.5;"></div>
  </div>
  <div style="position:absolute;top:48px;right:56px;">
    <div style="width:48px;height:48px;border-top:2.5px solid var(--text-tertiary);border-right:2.5px solid var(--text-tertiary);opacity:0.5;"></div>
  </div>
  <div style="position:absolute;bottom:48px;left:56px;">
    <div style="width:48px;height:48px;border-bottom:2.5px solid var(--text-tertiary);border-left:2.5px solid var(--text-tertiary);opacity:0.5;"></div>
  </div>
  <div style="position:absolute;bottom:48px;right:56px;">
    <div style="width:48px;height:48px;border-bottom:2.5px solid var(--text-tertiary);border-right:2.5px solid var(--text-tertiary);opacity:0.5;"></div>
  </div>

  <!-- Top HUD Bar -->
  <div style="position:absolute;top:52px;left:120px;right:120px;display:flex;justify-content:space-between;align-items:center;z-index:3;">
    <div style="display:flex;align-items:center;gap:16px;">
      <div style="display:flex;align-items:center;gap:6px;">
        <div style="width:10px;height:10px;border-radius:50%;background:var(--semantic-down);box-shadow:0 0 8px rgba(255,77,106,0.6);"></div>
        <span style="font-size:var(--fs-source);font-weight:700;color:var(--semantic-down);letter-spacing:1.5px;">REC</span>
      </div>
      <span style="font-size:var(--fs-source);font-weight:600;color:var(--text-tertiary);opacity:0.5;letter-spacing:1.5px;">{{hudRes}}</span>
    </div>
    <div style="display:flex;align-items:center;gap:16px;">
      <span style="font-size:var(--fs-source);font-weight:600;color:var(--text-tertiary);opacity:0.4;letter-spacing:1.5px;">{{hudTag3}}</span>
    </div>
  </div>

  <!-- Right side exposure info -->
  <div style="position:absolute;right:120px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:flex-end;gap:8px;z-index:3;">
    <span style="font-size:var(--fs-source);font-weight:600;color:var(--text-tertiary);opacity:0.3;letter-spacing:1px;font-variant-numeric:tabular-nums;">F2.8</span>
    <span style="font-size:var(--fs-source);font-weight:600;color:var(--text-tertiary);opacity:0.3;letter-spacing:1px;font-variant-numeric:tabular-nums;">1/120</span>
    <span style="font-size:var(--fs-source);font-weight:600;color:var(--text-tertiary);opacity:0.3;letter-spacing:1px;font-variant-numeric:tabular-nums;">ISO 800</span>
  </div>

  <!-- Left side exposure meter -->
  <div style="position:absolute;left:120px;top:50%;transform:translateY(-50%);z-index:3;">
    <div style="width:4px;height:120px;background:var(--text-tertiary);opacity:0.1;border-radius:2px;position:relative;">
      <div style="position:absolute;bottom:0;width:100%;height:65%;background:var(--text-tertiary);opacity:0.3;border-radius:2px;"></div>
      <div style="position:absolute;bottom:65%;left:-3px;width:10px;height:1.5px;background:var(--text-tertiary);opacity:0.4;"></div>
    </div>
  </div>

  <!-- Focus Ring + Crosshair -->
  <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none;">
    <!-- Main focus circle -->
    <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:560px;height:560px;border-radius:50%;border:1.5px solid var(--text-tertiary);opacity:0.2;"></div>
    <!-- Inner thin circle -->
    <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:540px;height:540px;border-radius:50%;border:0.5px solid var(--text-tertiary);opacity:0.08;"></div>
    <!-- Cardinal tick marks -->
    <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);">
      <div style="position:absolute;left:50%;top:-281px;transform:translateX(-50%);width:1.5px;height:20px;background:var(--text-tertiary);opacity:0.35;"></div>
      <div style="position:absolute;left:50%;bottom:-281px;transform:translateX(-50%);width:1.5px;height:20px;background:var(--text-tertiary);opacity:0.35;"></div>
      <div style="position:absolute;top:50%;left:-281px;transform:translateY(-50%);width:20px;height:1.5px;background:var(--text-tertiary);opacity:0.35;"></div>
      <div style="position:absolute;top:50%;right:-281px;transform:translateY(-50%);width:20px;height:1.5px;background:var(--text-tertiary);opacity:0.35;"></div>
    </div>
    <!-- Diagonal tick marks (45deg) -->
    <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);">
      <div style="position:absolute;top:-199px;left:199px;width:1.5px;height:16px;background:var(--text-tertiary);opacity:0.2;transform:rotate(-45deg);"></div>
      <div style="position:absolute;bottom:-199px;right:199px;width:1.5px;height:16px;background:var(--text-tertiary);opacity:0.2;transform:rotate(-45deg);"></div>
      <div style="position:absolute;top:-199px;right:199px;width:1.5px;height:16px;background:var(--text-tertiary);opacity:0.2;transform:rotate(45deg);"></div>
      <div style="position:absolute;bottom:-199px;left:199px;width:1.5px;height:16px;background:var(--text-tertiary);opacity:0.2;transform:rotate(45deg);"></div>
    </div>
    <!-- AF points (small squares around center) -->
    <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);">
      <div style="position:absolute;top:-80px;left:-160px;width:8px;height:8px;border:1px solid var(--text-tertiary);opacity:0.15;"></div>
      <div style="position:absolute;top:-80px;left:152px;width:8px;height:8px;border:1px solid var(--text-tertiary);opacity:0.15;"></div>
      <div style="position:absolute;top:72px;left:-160px;width:8px;height:8px;border:1px solid var(--text-tertiary);opacity:0.15;"></div>
      <div style="position:absolute;top:72px;left:152px;width:8px;height:8px;border:1px solid var(--text-tertiary);opacity:0.15;"></div>
      <div style="position:absolute;top:-4px;left:-220px;width:8px;height:8px;border:1px solid var(--text-tertiary);opacity:0.12;"></div>
      <div style="position:absolute;top:-4px;left:212px;width:8px;height:8px;border:1px solid var(--text-tertiary);opacity:0.12;"></div>
    </div>
    <!-- Inner crosshair -->
    <div style="position:absolute;top:50%;left:-32px;width:20px;height:1px;background:var(--text-tertiary);opacity:0.3;transform:translateY(-0.5px);"></div>
    <div style="position:absolute;top:50%;right:-32px;width:20px;height:1px;background:var(--text-tertiary);opacity:0.3;transform:translateY(-0.5px);"></div>
    <div style="position:absolute;left:50%;top:-32px;width:1px;height:20px;background:var(--text-tertiary);opacity:0.3;transform:translateX(-0.5px);"></div>
    <div style="position:absolute;left:50%;bottom:-32px;width:1px;height:20px;background:var(--text-tertiary);opacity:0.3;transform:translateX(-0.5px);"></div>
    <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:4px;height:4px;border-radius:50%;background:var(--text-tertiary);opacity:0.35;"></div>
  </div>

  <!-- Main Content -->
  <div style="display:flex;flex-direction:column;align-items:center;gap:16px;z-index:3;">
    <div style="font-size:var(--fs-display);font-weight:900;letter-spacing:-2px;line-height:1.05;text-align:center;color:var(--text-primary);">
      {{tagline}}
    </div>
    <div style="font-size:var(--fs-body);font-weight:500;color:var(--text-tertiary);text-align:center;letter-spacing:0.5px;">
      {{subtitle}}
    </div>
  </div>

  <!-- Bottom HUD -->
  <div style="position:absolute;bottom:52px;left:120px;right:120px;display:flex;justify-content:space-between;align-items:flex-end;z-index:3;">
    <div style="display:flex;align-items:center;gap:12px;">
      <span style="font-size:var(--fs-source);font-weight:600;color:var(--text-tertiary);opacity:0.3;font-variant-numeric:tabular-nums;letter-spacing:1.5px;">00:00:00:00</span>
      <div style="width:36px;height:4px;border-radius:2px;background:var(--text-tertiary);opacity:0.15;overflow:hidden;">
        <div style="width:70%;height:100%;background:var(--secondary);opacity:0.5;border-radius:2px;"></div>
      </div>
    </div>
    <!-- Level indicator -->
    <div style="display:flex;align-items:center;gap:2px;">
      <div style="width:24px;height:1.5px;background:var(--text-tertiary);opacity:0.2;"></div>
      <div style="width:24px;height:1.5px;background:var(--text-tertiary);opacity:0.2;"></div>
      <div style="width:8px;height:8px;border:1.5px solid var(--semantic-up);opacity:0.5;border-radius:1px;"></div>
      <div style="width:24px;height:1.5px;background:var(--text-tertiary);opacity:0.2;"></div>
      <div style="width:24px;height:1.5px;background:var(--text-tertiary);opacity:0.2;"></div>
    </div>
    <div style="font-size:var(--fs-source);font-weight:600;color:var(--text-tertiary);opacity:0.3;letter-spacing:1.5px;">{{hudBottom}}</div>
  </div>

</div>
