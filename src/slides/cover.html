<div class="slide" style="display:flex;align-items:center;justify-content:center;flex-direction:column;gap:0;">

  <!-- Logo -->
  <div style="position:absolute;top:40px;right:48px;">
    <img src="{{logoSrc}}" alt="CAPP!C" style="height:36px;filter:brightness(0) invert(1);opacity:0.7;" onerror="this.style.display='none'">
  </div>

  <!-- Center Circle -->
  <div style="width:420px;height:420px;border-radius:50%;border:3px solid rgba(255,255,255,0.15);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;">
    <div style="font-size:56px;font-weight:900;letter-spacing:-2px;line-height:1.1;text-align:center;color:#fff;">
      {{tagline}}
    </div>
    <div style="font-size:18px;font-weight:500;color:var(--text-tertiary);text-align:center;">
      {{subtitle}}
    </div>
  </div>

  <!-- Identity Line -->
  <div style="position:absolute;bottom:60px;font-size:18px;font-weight:600;color:var(--text-tertiary);text-align:center;">
    {{identity}}
  </div>

</div>
