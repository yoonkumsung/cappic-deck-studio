<div class="slide" style="display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;">

  <!-- Viewfinder Grid (subtle) -->
  <div style="position:absolute;inset:0;pointer-events:none;">
    <div style="position:absolute;left:33.33%;top:80px;bottom:80px;width:1px;background:rgba(255,255,255,0.04);"></div>
    <div style="position:absolute;left:66.66%;top:80px;bottom:80px;width:1px;background:rgba(255,255,255,0.04);"></div>
    <div style="position:absolute;top:33.33%;left:80px;right:80px;height:1px;background:rgba(255,255,255,0.04);"></div>
    <div style="position:absolute;top:66.66%;left:80px;right:80px;height:1px;background:rgba(255,255,255,0.04);"></div>
  </div>

  <!-- Corner Brackets -->
  <div style="position:absolute;top:48px;left:56px;">
    <div style="width:48px;height:48px;border-top:2.5px solid rgba(255,255,255,0.5);border-left:2.5px solid rgba(255,255,255,0.5);"></div>
  </div>
  <div style="position:absolute;top:48px;right:56px;">
    <div style="width:48px;height:48px;border-top:2.5px solid rgba(255,255,255,0.5);border-right:2.5px solid rgba(255,255,255,0.5);"></div>
  </div>
  <div style="position:absolute;bottom:48px;left:56px;">
    <div style="width:48px;height:48px;border-bottom:2.5px solid rgba(255,255,255,0.5);border-left:2.5px solid rgba(255,255,255,0.5);"></div>
  </div>
  <div style="position:absolute;bottom:48px;right:56px;">
    <div style="width:48px;height:48px;border-bottom:2.5px solid rgba(255,255,255,0.5);border-right:2.5px solid rgba(255,255,255,0.5);"></div>
  </div>

  <!-- Top HUD Bar -->
  <div style="position:absolute;top:52px;left:120px;right:120px;display:flex;justify-content:space-between;align-items:center;">
    <div style="display:flex;align-items:center;gap:16px;">
      <div style="display:flex;align-items:center;gap:6px;">
        <div style="width:10px;height:10px;border-radius:50%;background:#FF4D6A;box-shadow:0 0 8px rgba(255,77,106,0.6);"></div>
        <span style="font-size:15px;font-weight:700;color:#FF4D6A;letter-spacing:1.5px;">REC</span>
      </div>
      <span style="font-size:14px;font-weight:600;color:rgba(255,255,255,0.35);letter-spacing:1.5px;">{{hudRes}}</span>
    </div>
    <div style="display:flex;align-items:center;gap:16px;">
      <span style="font-size:13px;font-weight:600;color:rgba(126,220,230,0.6);letter-spacing:1.5px;border:1px solid rgba(126,220,230,0.25);padding:3px 10px;border-radius:4px;">{{hudTag1}}</span>
      <span style="font-size:13px;font-weight:600;color:rgba(247,225,80,0.6);letter-spacing:1.5px;border:1px solid rgba(247,225,80,0.25);padding:3px 10px;border-radius:4px;">{{hudTag2}}</span>
      <span style="font-size:13px;font-weight:600;color:rgba(255,255,255,0.3);letter-spacing:1.5px;">{{hudTag3}}</span>
    </div>
  </div>

  <!-- Center Crosshair -->
  <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none;">
    <div style="position:absolute;top:50%;left:-24px;width:14px;height:1px;background:rgba(126,220,230,0.3);transform:translateY(-0.5px);"></div>
    <div style="position:absolute;top:50%;right:-24px;width:14px;height:1px;background:rgba(126,220,230,0.3);transform:translateY(-0.5px);"></div>
    <div style="position:absolute;left:50%;top:-24px;width:1px;height:14px;background:rgba(126,220,230,0.3);transform:translateX(-0.5px);"></div>
    <div style="position:absolute;left:50%;bottom:-24px;width:1px;height:14px;background:rgba(126,220,230,0.3);transform:translateX(-0.5px);"></div>
    <div style="position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:4px;height:4px;border-radius:50%;background:rgba(126,220,230,0.4);"></div>
  </div>

  <!-- Main Content -->
  <div style="display:flex;flex-direction:column;align-items:center;gap:16px;z-index:1;">
    <div style="font-size:64px;font-weight:900;letter-spacing:-2px;line-height:1.05;text-align:center;color:#fff;">
      {{tagline}}
    </div>
    <div style="font-size:20px;font-weight:500;color:var(--text-tertiary);text-align:center;letter-spacing:0.5px;">
      {{subtitle}}
    </div>
  </div>

  <!-- Logo -->
  <div style="position:absolute;top:52px;left:50%;transform:translateX(-50%);">
    <img src="{{logoSrc}}" alt="CAPP!C" style="height:32px;opacity:0.8;" onerror="this.style.display='none'">
  </div>

  <!-- Bottom HUD -->
  <div style="position:absolute;bottom:52px;left:120px;right:120px;display:flex;justify-content:space-between;align-items:flex-end;">
    <div style="display:flex;align-items:center;gap:12px;">
      <span style="font-size:14px;font-weight:600;color:rgba(255,255,255,0.2);font-variant-numeric:tabular-nums;letter-spacing:1.5px;">00:00:00:00</span>
      <div style="width:36px;height:4px;border-radius:2px;background:rgba(255,255,255,0.08);overflow:hidden;">
        <div style="width:70%;height:100%;background:rgba(126,220,230,0.4);border-radius:2px;"></div>
      </div>
    </div>
    <div style="font-size:13px;font-weight:600;color:rgba(255,255,255,0.2);letter-spacing:1.5px;">{{hudBottom}}</div>
  </div>

</div>
