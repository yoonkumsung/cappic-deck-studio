<div class="slide" style="position:relative;">

  <!-- Title (top-left fixed) -->
  <div style="position:absolute;top:80px;left:120px;">
    <div style="font-size:48px;font-weight:800;color:#fff;line-height:1.3;">{{title}}</div>
  </div>

  <div style="position:absolute;top:220px;left:120px;right:120px;bottom:80px;">

    <!-- 3 Failure Types -->
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-bottom:24px;">

      <!-- Type 1 -->
      <div style="background:rgba(255,255,255,0.03);border-radius:16px;padding:28px;border-top:3px solid rgba(255,77,106,0.4);">
        <!-- Photo area -->
        <div style="height:140px;border-radius:10px;background:rgba(255,255,255,0.04);margin-bottom:20px;display:flex;align-items:center;justify-content:center;overflow:hidden;">
          <img src="{{type1Img}}" style="width:100%;height:100%;object-fit:cover;" onerror="this.parentElement.innerHTML='<span style=color:rgba(255,255,255,0.1);font-size:13px;>이미지 영역</span>'">
        </div>
        <div style="font-size:22px;font-weight:800;color:#fff;margin-bottom:6px;">{{type1Name}}</div>
        <div style="font-size:28px;font-weight:800;color:rgba(255,77,106,0.8);margin-bottom:8px;">{{type1Problem}}</div>
        <div style="font-size:18px;font-weight:700;color:rgba(255,255,255,0.25);">{{type1Price}}</div>
      </div>

      <!-- Type 2 -->
      <div style="background:rgba(255,255,255,0.03);border-radius:16px;padding:28px;border-top:3px solid rgba(255,77,106,0.4);">
        <div style="height:140px;border-radius:10px;background:rgba(255,255,255,0.04);margin-bottom:20px;display:flex;align-items:center;justify-content:center;overflow:hidden;">
          <img src="{{type2Img}}" style="width:100%;height:100%;object-fit:cover;" onerror="this.parentElement.innerHTML='<span style=color:rgba(255,255,255,0.1);font-size:13px;>이미지 영역</span>'">
        </div>
        <div style="font-size:22px;font-weight:800;color:#fff;margin-bottom:6px;">{{type2Name}}</div>
        <div style="font-size:28px;font-weight:800;color:rgba(255,77,106,0.8);margin-bottom:8px;">{{type2Problem}}</div>
        <div style="font-size:18px;font-weight:700;color:rgba(255,255,255,0.25);">{{type2Price}}</div>
      </div>

      <!-- Type 3 -->
      <div style="background:rgba(255,255,255,0.03);border-radius:16px;padding:28px;border-top:3px solid rgba(255,77,106,0.4);">
        <div style="height:140px;border-radius:10px;background:rgba(255,255,255,0.04);margin-bottom:20px;display:flex;align-items:center;justify-content:center;overflow:hidden;">
          <img src="{{type3Img}}" style="width:100%;height:100%;object-fit:cover;" onerror="this.parentElement.innerHTML='<span style=color:rgba(255,255,255,0.1);font-size:13px;>이미지 영역</span>'">
        </div>
        <div style="font-size:22px;font-weight:800;color:#fff;margin-bottom:6px;">{{type3Name}}</div>
        <div style="font-size:28px;font-weight:800;color:rgba(255,77,106,0.8);margin-bottom:8px;">{{type3Problem}}</div>
        <div style="font-size:18px;font-weight:700;color:rgba(255,255,255,0.25);">{{type3Price}}</div>
      </div>

    </div>

    <!-- CAPP!C Solution -->
    <div style="background:rgba(247,225,80,0.06);border-radius:16px;padding:28px;display:flex;align-items:center;gap:48px;">

      <!-- Left: Name + Price -->
      <div style="min-width:200px;">
        <div style="font-size:32px;font-weight:800;color:var(--accent);">{{cappicName}}</div>
        <div style="font-size:48px;font-weight:800;color:#fff;line-height:1;margin-top:4px;">{{cappicPrice}}</div>
      </div>

      <!-- Divider -->
      <div style="width:1px;height:70px;background:rgba(255,255,255,0.08);"></div>

      <!-- Right: Keywords -->
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px 40px;flex:1;">
        <div style="font-size:20px;font-weight:700;color:#fff;">{{cappicLine1}}</div>
        <div style="font-size:20px;font-weight:700;color:#fff;">{{cappicLine2}}</div>
        <div style="font-size:20px;font-weight:700;color:#fff;">{{cappicLine3}}</div>
        <div style="font-size:20px;font-weight:700;color:#fff;">{{cappicLine4}}</div>
      </div>

    </div>

  </div>

</div>
