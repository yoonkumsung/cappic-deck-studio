<div class="slide" style="position:relative;">

  <!-- Title (top-left fixed) -->
  <div style="position:absolute;top:80px;left:120px;">
    <div style="font-size:48px;font-weight:800;color:#fff;line-height:1.3;">{{title}}</div>
  </div>

  <div style="position:absolute;top:220px;left:120px;right:120px;bottom:80px;display:grid;grid-template-rows:1fr auto;gap:20px;">

    <!-- 3 Failure Types -->
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:20px;">

      <!-- Type 1 -->
      <div class="card" style="display:flex;flex-direction:column;padding:0;overflow:hidden;">
        <div style="flex:1;min-height:0;overflow:hidden;">
          <img src="{{type1Img}}" style="width:100%;height:100%;object-fit:cover;" onerror="this.style.display='none';this.parentElement.style.background='rgba(255,255,255,0.03)'">
        </div>
        <div style="padding:24px;position:relative;z-index:1;">
          <div style="font-size:22px;font-weight:800;color:#fff;margin-bottom:6px;">{{type1Name}}</div>
          <div style="font-size:24px;font-weight:800;color:#FF4D6A;margin-bottom:6px;">{{type1Problem}}</div>
          <div style="font-size:18px;font-weight:600;color:var(--text-secondary);">{{type1Price}}</div>
        </div>
      </div>

      <!-- Type 2 -->
      <div class="card" style="display:flex;flex-direction:column;padding:0;overflow:hidden;">
        <div style="flex:1;min-height:0;overflow:hidden;">
          <img src="{{type2Img}}" style="width:100%;height:100%;object-fit:cover;" onerror="this.style.display='none';this.parentElement.style.background='rgba(255,255,255,0.03)'">
        </div>
        <div style="padding:24px;position:relative;z-index:1;">
          <div style="font-size:22px;font-weight:800;color:#fff;margin-bottom:6px;">{{type2Name}}</div>
          <div style="font-size:24px;font-weight:800;color:#FF4D6A;margin-bottom:6px;">{{type2Problem}}</div>
          <div style="font-size:18px;font-weight:600;color:var(--text-secondary);">{{type2Price}}</div>
        </div>
      </div>

      <!-- Type 3 -->
      <div class="card" style="display:flex;flex-direction:column;padding:0;overflow:hidden;">
        <div style="flex:1;min-height:0;overflow:hidden;">
          <img src="{{type3Img}}" style="width:100%;height:100%;object-fit:cover;" onerror="this.style.display='none';this.parentElement.style.background='rgba(255,255,255,0.03)'">
        </div>
        <div style="padding:24px;position:relative;z-index:1;">
          <div style="font-size:22px;font-weight:800;color:#fff;margin-bottom:6px;">{{type3Name}}</div>
          <div style="font-size:24px;font-weight:800;color:#FF4D6A;margin-bottom:6px;">{{type3Problem}}</div>
          <div style="font-size:18px;font-weight:600;color:var(--text-secondary);">{{type3Price}}</div>
        </div>
      </div>

    </div>

    <!-- CAPP!C Solution -->
    <div class="card card-accent" style="padding:32px;display:flex;align-items:center;gap:48px;">
      <div style="position:relative;z-index:1;display:flex;align-items:center;gap:48px;width:100%;">
        <div style="min-width:200px;">
          <div style="font-size:32px;font-weight:800;color:var(--accent);">{{cappicName}}</div>
          <div style="font-size:48px;font-weight:800;color:#fff;line-height:1;margin-top:4px;">{{cappicPrice}}</div>
        </div>
        <div style="width:1px;height:70px;background:rgba(255,255,255,0.1);"></div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px 40px;flex:1;">
          <div style="font-size:20px;font-weight:700;color:#fff;">{{cappicLine1}}</div>
          <div style="font-size:20px;font-weight:700;color:#fff;">{{cappicLine2}}</div>
          <div style="font-size:20px;font-weight:700;color:#fff;">{{cappicLine3}}</div>
          <div style="font-size:20px;font-weight:700;color:#fff;">{{cappicLine4}}</div>
        </div>
      </div>
    </div>

  </div>

</div>
