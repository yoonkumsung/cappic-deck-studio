<div class="slide" style="position:relative;">

  <!-- Title -->
  <div style="position:absolute;top:80px;left:120px;">
    <div style="font-size:48px;font-weight:800;color:#fff;line-height:1.3;">{{title}}</div>
  </div>

  <div style="position:absolute;top:220px;left:120px;right:120px;bottom:80px;display:grid;grid-template-columns:repeat(3,1fr);gap:20px;">

    <!-- Type 1 -->
    <div class="card" style="display:flex;flex-direction:column;padding:0;overflow:hidden;">
      <div style="flex:1;min-height:0;overflow:hidden;background:rgba(255,255,255,0.03);">
        <img src="{{type1Img}}" style="width:100%;height:100%;object-fit:cover;" onerror="this.style.display='none'">
      </div>
      <div style="padding:32px;position:relative;z-index:1;">
        <div style="font-size:24px;font-weight:800;color:#fff;margin-bottom:8px;">{{type1Name}}</div>
        <div style="font-size:28px;font-weight:800;color:#FF4D6A;">{{type1Problem}}</div>
      </div>
    </div>

    <!-- Type 2 -->
    <div class="card" style="display:flex;flex-direction:column;padding:0;overflow:hidden;">
      <div style="flex:1;min-height:0;overflow:hidden;background:rgba(255,255,255,0.03);">
        <img src="{{type2Img}}" style="width:100%;height:100%;object-fit:cover;" onerror="this.style.display='none'">
      </div>
      <div style="padding:32px;position:relative;z-index:1;">
        <div style="font-size:24px;font-weight:800;color:#fff;margin-bottom:8px;">{{type2Name}}</div>
        <div style="font-size:28px;font-weight:800;color:#FF4D6A;">{{type2Problem}}</div>
      </div>
    </div>

    <!-- Type 3 -->
    <div class="card" style="display:flex;flex-direction:column;padding:0;overflow:hidden;">
      <div style="flex:1;min-height:0;overflow:hidden;background:rgba(255,255,255,0.03);">
        <img src="{{type3Img}}" style="width:100%;height:100%;object-fit:cover;" onerror="this.style.display='none'">
      </div>
      <div style="padding:32px;position:relative;z-index:1;">
        <div style="font-size:24px;font-weight:800;color:#fff;margin-bottom:8px;">{{type3Name}}</div>
        <div style="font-size:28px;font-weight:800;color:#FF4D6A;">{{type3Problem}}</div>
      </div>
    </div>

  </div>

</div>
