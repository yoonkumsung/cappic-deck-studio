<div class="slide">
  <div class="slide-title">{{title}}</div>

  <div class="slide-content" style="display:grid;grid-template-columns:3fr 2fr;gap:var(--slide-gap);">

    <!-- Left: Product Photo (60%) -->
    <div class="sg-photo" style="border-radius:var(--card-radius);overflow:hidden;height:100%;">
      <img src="{{photoSrc}}" style="width:100%;height:100%;object-fit:cover;" onerror="this.style.display='none'">
    </div>

    <!-- Right: Specs Card (40%) -->
    <div class="card card-accent" style="display:flex;flex-direction:column;overflow:hidden;height:100%;">
      <div style="padding:var(--card-pad);flex:1;display:flex;flex-direction:column;position:relative;z-index:1;">
        <div style="font-size:var(--fs-heading);font-weight:var(--fw-heading);color:var(--accent);margin-bottom:var(--sp-sm);">{{cardTitle}}</div>
        <div style="flex:1;display:flex;flex-direction:column;justify-content:space-evenly;">
          <div class="sg-item">
            <div class="sg-item-label">{{spec1Label}}</div>
            <div class="sg-item-value" style="color:var(--text-primary);">{{spec1Value}}</div>
          </div>
          <div class="sg-item">
            <div class="sg-item-label">{{spec2Label}}</div>
            <div class="sg-item-value" style="color:var(--text-primary);">{{spec2Value}}</div>
          </div>
          <div class="sg-item">
            <div class="sg-item-label">{{spec3Label}}</div>
            <div class="sg-item-value" style="color:var(--text-primary);">{{spec3Value}}</div>
          </div>
          <div class="sg-item">
            <div class="sg-item-label">{{spec4Label}}</div>
            <div class="sg-item-value" style="color:var(--text-primary);">{{spec4Value}}</div>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>
