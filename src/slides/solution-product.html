<div class="slide">
  <div class="slide-title">{{title}}</div>

  <div class="slide-content" style="display:grid;grid-template-columns:3fr 2fr;gap:var(--slide-gap);height:100%;">

    <!-- Left: Product Photo (60%) -->
    <div class="sg-photo" style="border-radius:var(--card-radius);overflow:hidden;">
      <img src="{{photoSrc}}" style="width:100%;height:100%;object-fit:cover;" onerror="this.style.display='none'">
    </div>

    <!-- Right: Specs Card (40%) -->
    <div class="card card-accent sg-card-col">
      <div class="sg-data" style="height:100%;">
        <div class="sg-card-title">{{cardTitle}}</div>
        <div class="sg-data-list">
          <div class="sg-item">
            <div class="sg-item-label">{{spec1Label}}</div>
            <div class="sg-item-value">{{spec1Value}}</div>
          </div>
          <div class="sg-item">
            <div class="sg-item-label">{{spec2Label}}</div>
            <div class="sg-item-value">{{spec2Value}}</div>
          </div>
          <div class="sg-item">
            <div class="sg-item-label">{{spec3Label}}</div>
            <div class="sg-item-value">{{spec3Value}}</div>
          </div>
          <div class="sg-item">
            <div class="sg-item-label">{{spec4Label}}</div>
            <div class="sg-item-value">{{spec4Value}}</div>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>
