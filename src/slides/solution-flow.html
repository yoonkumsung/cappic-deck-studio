<div class="slide">
  <div class="slide-title">{{title}}</div>

  <div class="slide-content sg-cols-3">

    <div class="card" style="display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;">
      <div style="position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:var(--sp-md);">
        <div class="sg-stat-value" style="color:var(--accent);">{{step1Num}}</div>
        <div style="font-size:var(--fs-heading);font-weight:var(--fw-heading);color:var(--text-primary);">{{step1Name}}</div>
        <div style="font-size:var(--fs-body);font-weight:var(--fw-body);color:var(--text-secondary);">{{step1Desc}}</div>
      </div>
    </div>

    <div class="card" style="display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;">
      <div style="position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:var(--sp-md);">
        <div class="sg-stat-value" style="color:var(--accent);">{{step2Num}}</div>
        <div style="font-size:var(--fs-heading);font-weight:var(--fw-heading);color:var(--text-primary);">{{step2Name}}</div>
        <div style="font-size:var(--fs-body);font-weight:var(--fw-body);color:var(--text-secondary);">{{step2Desc}}</div>
      </div>
    </div>

    <div class="card" style="display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;">
      <div style="position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:var(--sp-md);">
        <div class="sg-stat-value" style="color:var(--accent);">{{step3Num}}</div>
        <div style="font-size:var(--fs-heading);font-weight:var(--fw-heading);color:var(--text-primary);">{{step3Name}}</div>
        <div style="font-size:var(--fs-body);font-weight:var(--fw-body);color:var(--text-secondary);">{{step3Desc}}</div>
      </div>
    </div>

  </div>
</div>
