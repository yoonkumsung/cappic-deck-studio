<div class="slide">
  <div class="slide-title">{{title}}</div>

  <div class="slide-content sg-cols-3">

    <!-- Step 1 -->
    <div style="display:flex;flex-direction:column;gap:var(--sp-md);">
      <div style="color:var(--accent);font-size:var(--fs-display);font-weight:var(--fw-display);line-height:1;">{{step1Num}}</div>
      <div style="font-size:var(--fs-heading);font-weight:var(--fw-heading);color:var(--text-primary);">{{step1Name}}</div>
      <div style="font-size:var(--fs-body);font-weight:var(--fw-body);color:var(--text-secondary);">{{step1Desc}}</div>
      <div class="sg-photo" style="border-radius:var(--card-radius);overflow:hidden;flex:1;">
        <img src="{{step1Photo}}" style="width:100%;height:100%;object-fit:cover;" onerror="this.style.display='none'">
      </div>
    </div>

    <!-- Step 2 -->
    <div style="display:flex;flex-direction:column;gap:var(--sp-md);">
      <div style="color:var(--accent);font-size:var(--fs-display);font-weight:var(--fw-display);line-height:1;">{{step2Num}}</div>
      <div style="font-size:var(--fs-heading);font-weight:var(--fw-heading);color:var(--text-primary);">{{step2Name}}</div>
      <div style="font-size:var(--fs-body);font-weight:var(--fw-body);color:var(--text-secondary);">{{step2Desc}}</div>
      <div class="sg-photo" style="border-radius:var(--card-radius);overflow:hidden;flex:1;">
        <img src="{{step2Photo}}" style="width:100%;height:100%;object-fit:cover;" onerror="this.style.display='none'">
      </div>
    </div>

    <!-- Step 3 -->
    <div style="display:flex;flex-direction:column;gap:var(--sp-md);">
      <div style="color:var(--accent);font-size:var(--fs-display);font-weight:var(--fw-display);line-height:1;">{{step3Num}}</div>
      <div style="font-size:var(--fs-heading);font-weight:var(--fw-heading);color:var(--text-primary);">{{step3Name}}</div>
      <div style="font-size:var(--fs-body);font-weight:var(--fw-body);color:var(--text-secondary);">{{step3Desc}}</div>
      <div class="sg-photo" style="border-radius:var(--card-radius);overflow:hidden;flex:1;">
        <img src="{{step3Photo}}" style="width:100%;height:100%;object-fit:cover;" onerror="this.style.display='none'">
      </div>
    </div>

  </div>
</div>
