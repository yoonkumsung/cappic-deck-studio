<div class="slide" style="position:relative;">

  <!-- Title -->
  <div style="position:absolute;top:80px;left:120px;">
    <div style="font-size:48px;font-weight:800;color:#fff;line-height:1.3;">{{title}}</div>
  </div>

  <div style="position:absolute;top:220px;left:120px;right:120px;bottom:80px;">

    <div class="card" style="height:100%;padding:0;overflow:hidden;">
      <div style="position:relative;z-index:1;height:100%;display:flex;flex-direction:column;">

        <!-- Header -->
        <div style="display:grid;grid-template-columns:180px repeat(4,1fr);border-bottom:1px solid rgba(255,255,255,0.06);">
          <div style="padding:24px 32px;"></div>
          <div style="padding:24px 32px;font-size:20px;font-weight:800;color:var(--text-secondary);">{{col1Name}}</div>
          <div style="padding:24px 32px;font-size:20px;font-weight:800;color:var(--text-secondary);">{{col2Name}}</div>
          <div style="padding:24px 32px;font-size:20px;font-weight:800;color:var(--text-secondary);">{{col3Name}}</div>
          <div style="padding:24px 32px;font-size:20px;font-weight:800;color:var(--accent);background:rgba(247,225,80,0.04);">{{col4Name}}</div>
        </div>

        <!-- Rows -->
        <div style="flex:1;display:flex;flex-direction:column;">

          <div style="flex:1;display:grid;grid-template-columns:180px repeat(4,1fr);align-items:center;border-bottom:1px solid rgba(255,255,255,0.04);">
            <div style="padding:20px 32px;font-size:20px;font-weight:700;color:var(--text-secondary);">{{row1Label}}</div>
            <div style="padding:20px 32px;font-size:20px;font-weight:700;color:var(--text-secondary);">{{r1c1}}</div>
            <div style="padding:20px 32px;font-size:20px;font-weight:700;color:var(--text-secondary);">{{r1c2}}</div>
            <div style="padding:20px 32px;font-size:20px;font-weight:700;color:var(--text-secondary);">{{r1c3}}</div>
            <div style="padding:20px 32px;font-size:20px;font-weight:800;color:#fff;background:rgba(247,225,80,0.04);">{{r1c4}}</div>
          </div>

          <div style="flex:1;display:grid;grid-template-columns:180px repeat(4,1fr);align-items:center;border-bottom:1px solid rgba(255,255,255,0.04);">
            <div style="padding:20px 32px;font-size:20px;font-weight:700;color:var(--text-secondary);">{{row2Label}}</div>
            <div style="padding:20px 32px;font-size:20px;font-weight:700;color:var(--text-secondary);">{{r2c1}}</div>
            <div style="padding:20px 32px;font-size:20px;font-weight:700;color:var(--text-secondary);">{{r2c2}}</div>
            <div style="padding:20px 32px;font-size:20px;font-weight:700;color:var(--text-secondary);">{{r2c3}}</div>
            <div style="padding:20px 32px;font-size:20px;font-weight:800;color:#fff;background:rgba(247,225,80,0.04);">{{r2c4}}</div>
          </div>

          <div style="flex:1;display:grid;grid-template-columns:180px repeat(4,1fr);align-items:center;border-bottom:1px solid rgba(255,255,255,0.04);">
            <div style="padding:20px 32px;font-size:20px;font-weight:700;color:var(--text-secondary);">{{row3Label}}</div>
            <div style="padding:20px 32px;font-size:20px;font-weight:700;color:var(--text-secondary);">{{r3c1}}</div>
            <div style="padding:20px 32px;font-size:20px;font-weight:700;color:var(--text-secondary);">{{r3c2}}</div>
            <div style="padding:20px 32px;font-size:20px;font-weight:700;color:var(--text-secondary);">{{r3c3}}</div>
            <div style="padding:20px 32px;font-size:20px;font-weight:800;color:#fff;background:rgba(247,225,80,0.04);">{{r3c4}}</div>
          </div>

          <div style="flex:1;display:grid;grid-template-columns:180px repeat(4,1fr);align-items:center;">
            <div style="padding:20px 32px;font-size:20px;font-weight:700;color:var(--text-secondary);">{{row4Label}}</div>
            <div style="padding:20px 32px;font-size:20px;font-weight:700;color:var(--text-secondary);">{{r4c1}}</div>
            <div style="padding:20px 32px;font-size:20px;font-weight:700;color:var(--text-secondary);">{{r4c2}}</div>
            <div style="padding:20px 32px;font-size:20px;font-weight:700;color:var(--text-secondary);">{{r4c3}}</div>
            <div style="padding:20px 32px;font-size:20px;font-weight:800;color:#fff;background:rgba(247,225,80,0.04);">{{r4c4}}</div>
          </div>

        </div>

      </div>
    </div>

  </div>

</div>
