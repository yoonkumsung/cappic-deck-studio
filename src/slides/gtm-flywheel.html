<div class="slide">
  <div class="slide-title">{{title}}</div>

  <div class="slide-content sg-cols-4">

    <!-- Year 1 -->
    <div style="display:flex;flex-direction:column;justify-content:flex-end;height:100%;gap:var(--sp-sm);">
      <div style="font-size:var(--fs-heading);font-weight:var(--fw-heading);color:var(--text-primary);text-align:center;">{{year1Label}}</div>
      <div style="font-size:var(--fs-body);font-weight:var(--fw-body);color:var(--text-secondary);text-align:center;">{{year1Milestone}}</div>
      <div style="background:var(--accent);border-radius:var(--sp-xs);height:80px;display:flex;align-items:center;justify-content:center;">
        <span style="font-size:var(--fs-heading);font-weight:var(--fw-heading);color:#000000;">{{year1Revenue}}</span>
      </div>
      <div style="font-size:var(--fs-display);font-weight:var(--fw-display);color:var(--accent);text-align:center;line-height:1;">{{year1Name}}</div>
    </div>

    <!-- Year 2 -->
    <div style="display:flex;flex-direction:column;justify-content:flex-end;height:100%;gap:var(--sp-sm);">
      <div style="font-size:var(--fs-heading);font-weight:var(--fw-heading);color:var(--text-primary);text-align:center;">{{year2Label}}</div>
      <div style="font-size:var(--fs-body);font-weight:var(--fw-body);color:var(--text-secondary);text-align:center;">{{year2Milestone}}</div>
      <div style="background:var(--secondary);border-radius:var(--sp-xs);height:160px;display:flex;align-items:center;justify-content:center;">
        <span style="font-size:var(--fs-heading);font-weight:var(--fw-heading);color:#000000;">{{year2Revenue}}</span>
      </div>
      <div style="font-size:var(--fs-display);font-weight:var(--fw-display);color:var(--secondary);text-align:center;line-height:1;">{{year2Name}}</div>
    </div>

    <!-- Year 3 -->
    <div style="display:flex;flex-direction:column;justify-content:flex-end;height:100%;gap:var(--sp-sm);">
      <div style="font-size:var(--fs-heading);font-weight:var(--fw-heading);color:var(--text-primary);text-align:center;">{{year3Label}}</div>
      <div style="font-size:var(--fs-body);font-weight:var(--fw-body);color:var(--text-secondary);text-align:center;">{{year3Milestone}}</div>
      <div style="background:var(--secondary);border-radius:var(--sp-xs);height:280px;display:flex;align-items:center;justify-content:center;">
        <span style="font-size:var(--fs-heading);font-weight:var(--fw-heading);color:#000000;">{{year3Revenue}}</span>
      </div>
      <div style="font-size:var(--fs-display);font-weight:var(--fw-display);color:var(--text-primary);text-align:center;line-height:1;">{{year3Name}}</div>
    </div>

    <!-- Year 4 -->
    <div style="display:flex;flex-direction:column;justify-content:flex-end;height:100%;gap:var(--sp-sm);">
      <div style="font-size:var(--fs-heading);font-weight:var(--fw-heading);color:var(--text-primary);text-align:center;">{{year4Label}}</div>
      <div style="font-size:var(--fs-body);font-weight:var(--fw-body);color:var(--text-secondary);text-align:center;">{{year4Milestone}}</div>
      <div style="background:var(--accent);border-radius:var(--sp-xs);height:420px;display:flex;align-items:center;justify-content:center;">
        <span style="font-size:var(--fs-heading);font-weight:var(--fw-heading);color:#000000;">{{year4Revenue}}</span>
      </div>
      <div style="font-size:var(--fs-display);font-weight:var(--fw-display);color:var(--accent);text-align:center;line-height:1;">{{year4Name}}</div>
    </div>

  </div>
</div>
