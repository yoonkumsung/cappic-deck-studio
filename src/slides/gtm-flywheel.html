<div class="slide">
  <div class="slide-title">{{title}}</div>

  <div class="slide-content sg-cols-2">

    <!-- Left: Flywheel diagram -->
    <div style="display:flex;align-items:center;justify-content:center;position:relative;">
      <div style="width:420px;height:420px;border-radius:50%;border:2px solid rgba(126,220,230,0.2);position:relative;display:flex;align-items:center;justify-content:center;">

        <!-- Center label -->
        <div style="text-align:center;z-index:1;">
          <div style="font-size:var(--fs-heading);font-weight:var(--fw-heading);color:var(--accent);">{{flywheelCenter}}</div>
        </div>

        <!-- Top -->
        <div style="position:absolute;top:-var(--sp-sm);left:50%;transform:translateX(-50%);text-align:center;">
          <div style="font-size:var(--fs-body);font-weight:var(--fw-heading);color:var(--text-primary);">{{fw1}}</div>
        </div>
        <!-- Right -->
        <div style="position:absolute;top:50%;right:-var(--sp-xl);transform:translateY(-50%);text-align:center;">
          <div style="font-size:var(--fs-body);font-weight:var(--fw-heading);color:var(--secondary);">{{fw2}}</div>
        </div>
        <!-- Bottom -->
        <div style="position:absolute;bottom:-var(--sp-sm);left:50%;transform:translateX(-50%);text-align:center;">
          <div style="font-size:var(--fs-body);font-weight:var(--fw-heading);color:var(--text-primary);">{{fw3}}</div>
        </div>
        <!-- Left -->
        <div style="position:absolute;top:50%;left:-var(--sp-xl);transform:translateY(-50%);text-align:center;">
          <div style="font-size:var(--fs-body);font-weight:var(--fw-heading);color:var(--secondary);">{{fw4}}</div>
        </div>

        <!-- Rotation arrows (SVG) -->
        <svg style="position:absolute;inset:0;width:100%;height:100%;" viewBox="0 0 420 420">
          <path d="M 210 30 A 180 180 0 0 1 390 210" fill="none" stroke="rgba(126,220,230,0.3)" stroke-width="2" stroke-dasharray="8 4" />
          <path d="M 390 210 A 180 180 0 0 1 210 390" fill="none" stroke="rgba(126,220,230,0.3)" stroke-width="2" stroke-dasharray="8 4" />
          <path d="M 210 390 A 180 180 0 0 1 30 210" fill="none" stroke="rgba(126,220,230,0.3)" stroke-width="2" stroke-dasharray="8 4" />
          <path d="M 30 210 A 180 180 0 0 1 210 30" fill="none" stroke="rgba(126,220,230,0.3)" stroke-width="2" stroke-dasharray="8 4" />
        </svg>
      </div>
    </div>

    <!-- Right: Timeline milestones -->
    <div class="card" style="display:flex;flex-direction:column;justify-content:center;">
      <div style="position:relative;z-index:1;">
        <div class="sg-card-title">{{timelineTitle}}</div>
        <div class="sg-data-list">
          <div class="sg-item">
            <div class="sg-item-label">{{t1Label}}</div>
            <div class="sg-item-value" style="color:var(--accent);">{{t1Value}}</div>
          </div>
          <div class="sg-item">
            <div class="sg-item-label">{{t2Label}}</div>
            <div class="sg-item-value">{{t2Value}}</div>
          </div>
          <div class="sg-item">
            <div class="sg-item-label">{{t3Label}}</div>
            <div class="sg-item-value">{{t3Value}}</div>
          </div>
          <div class="sg-item">
            <div class="sg-item-label">{{t4Label}}</div>
            <div class="sg-item-value" style="color:var(--secondary);">{{t4Value}}</div>
          </div>
        </div>
      </div>
    </div>

  </div>
</div>
