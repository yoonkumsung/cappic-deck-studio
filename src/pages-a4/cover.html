<div class="page-a4" style="display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;">
  <div style="font-size:var(--a4-fs-caption);color:var(--text-tertiary);letter-spacing:4px;margin-bottom:24px;">사업계획서</div>
  <div style="font-size:40px;font-weight:800;color:var(--text-primary);margin-bottom:12px;">{{title}}</div>
  <div style="font-size:var(--a4-fs-heading);color:var(--secondary);margin-bottom:48px;">{{subtitle}}</div>
  <hr style="width:60px;border:none;border-top:2px solid var(--secondary);margin-bottom:48px;">
  <div style="font-size:var(--a4-fs-body);color:var(--text-secondary);margin-bottom:8px;">{{company}}</div>
  <div style="font-size:var(--a4-fs-caption);color:var(--text-tertiary);">{{date}}</div>
  <div style="font-size:var(--a4-fs-caption);color:var(--text-tertiary);margin-top:4px;">{{contact}}</div>
</div>
